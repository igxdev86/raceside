<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ULTRA — RACESIDE</title>
<script src="/nav.js" defer></script>
<style>
:root{--ubg:#070B12;--upanel:#0D1420;--upanel2:#111B2B;--uline:#1C2940;--uline2:#27395C;
--uink:#E8EEF7;--udim:#9FB2CC;--ufaint:#6B7E9A;--cy:#00D1FF;--am:#FFB300;--grn:#00E676;--red:#FF3B5C;
--umono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--ucond:-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%}
html body{background:var(--ubg)!important;color:var(--uink)!important;font-family:var(--ucond);padding:12px 10px 60px}
body .wrap{max-width:760px;margin:0}
h1{font-size:24px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
background:linear-gradient(90deg,var(--am),var(--grn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
.usub{font-size:11px;letter-spacing:.18em;color:var(--ufaint);font-weight:800;margin:4px 0 12px}
.usub a{color:var(--ufaint);text-decoration:none}
.upd{font-family:var(--umono);font-size:10.5px;color:var(--cy);margin:2px 0 12px}
.dash{display:flex;gap:7px;margin:0 0 12px;flex-wrap:wrap}
.dcell{flex:1;min-width:30%;background:linear-gradient(180deg,var(--upanel2),var(--upanel));border:1px solid var(--uline);
border-top:3px solid var(--am);border-radius:6px;padding:9px 4px 8px;text-align:center}
.dcell small{display:block;font-size:8px;letter-spacing:.1em;color:var(--udim);font-weight:800;text-transform:uppercase}
.dcell b{display:block;font-family:var(--umono);font-size:18px;font-weight:700;color:#fff;margin:3px 0 1px}
.dcell span{font-family:var(--umono);font-size:10px;color:var(--grn);font-weight:700}
.note{font-family:var(--umono);font-size:10.5px;color:var(--ufaint);margin:0 0 14px;line-height:1.7}
.utile{background:var(--upanel);border:1px solid var(--uline);border-left:3px solid var(--am);border-radius:8px;padding:11px 12px;margin:0 0 10px}
.utile .hd2{font-size:11px;letter-spacing:.2em;font-weight:900;color:var(--am);text-transform:uppercase;margin-bottom:7px}
.uln{font-family:var(--umono);font-size:11.5px;line-height:1.9;padding:5px 0;border-bottom:1px solid var(--uline)}
.uln:last-child{border-bottom:0}
.uln small{color:var(--ufaint)}
.uln b{color:#fff}
.uln .p1{color:var(--grn);font-weight:900}
.uln .pbad{color:var(--red);font-weight:700}
.uln .tot{color:var(--am);font-weight:900}
.uln .rline{display:block;color:var(--udim);font-size:10.5px}
.uln .rline small{margin-right:1px}
.uln .rline span{color:#C7D3E4;font-weight:700;margin-right:5px}
.uln .rline .rk1{color:var(--grn)}
.err{color:var(--red);font-family:var(--umono);font-size:11px}
.mart{border:1px solid #33497A;border-radius:8px;padding:10px 12px;margin:0 0 12px;background:#0A1526}
.mart .mh{font-size:10px;letter-spacing:.14em;font-weight:900;color:#00D1FF;margin-bottom:7px}
.mart .mln{font-family:var(--umono);font-size:12px;line-height:2;color:#E8EEF7!important;border-bottom:1px solid #16233C}
.mart .mln:last-of-type{border-bottom:0}
.mart .mln small{color:#9FB2CC}
.mart .mln .p1{color:#00E676;font-weight:900}
.mart .mln .pbad{color:#FF3B5C;font-weight:900}
.mart .msum{font-family:var(--umono);font-size:12px;line-height:1.9;color:#C7D3E4;border-top:1px solid #33497A;margin-top:7px;padding-top:7px}
.mart .msum b{color:#FFB300}
.mart .msum small{color:#9FB2CC}
.amp{color:var(--am)}
</style>
</head>
<body>
<div class="wrap">
<h1>ULTRA</h1>
<div class="usub">WINNERS × RANK TABLE · <a href="/maxterminalx.html">&larr; TERMINAL X</a></div>
<div class="upd" id="upd">loading…</div>
<div id="app"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const dayKey = (off) => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(off);
const RL = { d: '@', jt: 'JT', or: 'OR', sig: 'Σ', mp: 'MN', mx: 'MX', tm: 'TM', pts: 'PTS', pwr: 'PWR' };
const t2m9 = (t) => { const m = String(t || '').match(/(\d{1,2})[:.](\d{2})/); if (!m) return 0;
  let hh = +m[1]; if (hh < 11) hh += 12; return hh * 60 + (+m[2]); };

async function boot() {
  const getLedger = async () => { try {
    const r = await fetch('/api/yearstate?k=comboledger:v1&t=' + Date.now()); const j = await r.json();
    const dz = (j && j.state && j.state.days) || null;
    return dz && Object.keys(dz).length ? dz : null; } catch { return null; } };
  let ledger = await getLedger();
  const todayK = dayKey(new Date());
  const hasUltra = (L) => { const u = L && L[todayK] && L[todayK].ultra;
    if (!Array.isArray(u)) return false;
    return u.length === 0 || u.some(e => e && e.bd != null); };
  if (!hasUltra(ledger)) {
    $('upd').textContent = 'banking today from TERMINAL X…';
    const fr = document.createElement('iframe');
    fr.src = '/maxterminalx.html'; fr.style.cssText = 'position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-9999px';
    document.body.appendChild(fr);
    const t0 = Date.now();
    for (let w9 = 0; w9 < 15; w9++) {
      await new Promise(r9 => setTimeout(r9, 4000));
      $('upd').textContent = `banking today from TERMINAL X… ${Math.round((Date.now() - t0) / 1000)}s`;
      const l2 = await getLedger();
      if (hasUltra(l2)) { ledger = l2; break; }
      if (l2) ledger = l2;
    }
    fr.remove();
  }
  if (!ledger) { $('app').innerHTML = '<div class="utile"><div class="hd2">No record yet</div><div class="uln"><small>Open TERMINAL X once during racing and winners bank automatically with their rank scores.</small></div></div>';
    $('upd').textContent = 'empty'; return; }
  const days = Object.keys(ledger).filter(d => Array.isArray(ledger[d].ultra) && ledger[d].ultra.length).sort().reverse();
  let races = 0, bestWon = 0, top3 = 0, totSum = 0, posSum = 0, staked = 0, ret = 0;
  days.forEach(d => ledger[d].ultra.forEach(e => { races++; bestWon += e.bw ? 1 : 0;
    if (e.pos && e.pos <= 3) top3++; totSum += e.tot || 0; posSum += e.pos || 0;
    if (e.bd != null) { staked++; if (e.bw) ret += e.bd; } }));
  const pl = ret - staked, roi = staked ? Math.round(pl / staked * 1000) / 10 : null;
  const pc = (w, n) => n ? Math.round(w / n * 100) : 0;
  const tiles = `<div class="dash">
    <div class="dcell"><small>ULTRA #1 WON</small><b>${bestWon}/${races}</b><span>${pc(bestWon, races)}%</span></div>
    <div class="dcell"><small>WINNER TOP 3</small><b>${top3}/${races}</b><span>${pc(top3, races)}%</span></div>
    <div class="dcell"><small>AVG WIN POS</small><b>#${races ? Math.round(posSum / races * 10) / 10 : '—'}</b><span>of field</span></div>
    <div class="dcell"><small>AVG WIN TOTAL</small><b>${races ? Math.round(totSum / races * 10) / 10 : '—'}</b><span>rank sum</span></div>
    <div class="dcell"><small>£1 ON ULTRA #1</small><b>${staked ? '£' + (Math.round(ret * 100) / 100).toFixed(2) : '—'}</b><span>${staked ? 'staked £' + staked : 'no odds banked yet'}</span></div>
    <div class="dcell"><small>ROI</small><b style="color:${roi == null ? 'var(--udim)' : roi >= 0 ? 'var(--grn)' : 'var(--red)'}">${roi == null ? '—' : (roi > 0 ? '+' : '') + roi + '%'}</b><span>${staked ? (pl >= 0 ? '+' : '') + '£' + (Math.round(pl * 100) / 100).toFixed(2) + ' P/L' : ''}</span></div>
  </div>`;
  const campaign = (() => {
    const daysAsc = days.slice().sort();
    let L = 0, pl = 0, peak = 0, run = 0, maxRun = 0, bets = 0, stkSum = 0, stopped = false;
    const dRows = [];
    for (const d of daysAsc) {
      if (stopped) break;
      const seq = ledger[d].ultra.slice().sort((a, b) => t2m9(a.t) - t2m9(b.t));
      let w9 = 0, b9 = 0;
      for (const e of seq) {
        if (pl >= 1000) { stopped = true; break; }
        if (e.bd == null) continue;
        const s = Math.round((L + 10) / (e.bd - 1) * 100) / 100;
        peak = Math.max(peak, s); bets++; b9++; stkSum += s;
        if (e.bw) { pl += 10; L = 0; run = 0; w9++; }
        else { L += s; run++; maxRun = Math.max(maxRun, run); }
      }
      dRows.push({ d, b9, w9, pl: pl - L, L });
    }
    if (!bets) return '';
    const net = pl - L;
    const nx = (dd) => Math.round((L + 10) / (dd - 1) * 100) / 100;
    return `<div class="utile" style="border-left-color:var(--cy)"><div class="hd2" style="color:var(--cy)">CAMPAIGN \u2014 one continuous ladder, \u00a310/cycle, stop at +\u00a31,000</div>
      <div class="msum" style="border:0;margin:0 0 6px;padding:0">position <b style="color:${net >= 0 ? 'var(--grn)' : 'var(--red)'}">${net < 0 ? '\u2212' : '+'}\u00a3${Math.abs(net).toFixed(2)}</b> \u00b7 banked <b>\u00a3${pl.toFixed(2)}</b>${L > 0 ? ` \u00b7 open ladder <b style="color:var(--red)">\u2212\u00a3${L.toFixed(2)}</b> \u00b7 next stake <b>\u00a3${nx(3)}</b> @3.0 / <b>\u00a3${nx(2)}</b> @2.0` : ' \u00b7 ladder clear'}${stopped ? ' \u00b7 <b style="color:var(--grn)">TARGET HIT \u2713</b>' : ''}<br>${bets} bets \u00b7 \u00a3${stkSum.toFixed(2)} turned over \u00b7 peak stake <b>\u00a3${peak.toFixed(2)}</b> \u00b7 longest run <b>${maxRun}\u2717</b></div>${
      dRows.map(r => `<div class="mln">${r.d} <small>\u00b7</small> ${r.w9}/${r.b9} cycles <small>\u00b7</small> <b style="color:${r.pl >= 0 ? 'var(--grn)' : 'var(--red)'}">${r.pl < 0 ? '\u2212' : '+'}\u00a3${Math.abs(r.pl).toFixed(2)}</b>${r.L > 0 ? ` <small>carrying \u00a3${r.L.toFixed(2)}</small>` : ''}</div>`).join('')
    }</div>`;
  })();
  const dayBlocks = days.map(d => {
    const rows = ledger[d].ultra.slice().sort((a, b) => t2m9(a.t) - t2m9(b.t)).map(e => {
      const posHtml = e.pos === 1 ? `<span class="p1">ULTRA #1 ✓</span>` : `<span class="${e.pos > Math.ceil(e.n / 2) ? 'pbad' : 'amp'}">ULTRA #${e.pos}</span>`;
      const rline = Object.entries(e.rks || {}).filter(([, v]) => v != null)
        .map(([k, v]) => `<small>${RL[k] || k.toUpperCase()}</small><span${v === 1 ? ' class="rk1"' : ''}>${v}</span>`).join(' ');
      const missed = e.pos !== 1 && e.bh ? ` <small>· #1 was ${e.bh}${e.bd != null ? ' @ ' + e.bd : ''} (${e.bt})</small>` : '';
      return `<div class="uln">${e.t} ${String(e.c).toUpperCase()} — <b>${e.w}</b>${e.wd != null ? ` <small>@ ${e.wd}</small>` : ''} · ${posHtml} of ${e.n} · <span class="tot">${e.tot}</span>${missed}<span class="rline">${rline}</span></div>`;
    }).join('');
    const mart = (() => {
      const seq = ledger[d].ultra.slice().sort((a, b) => t2m9(a.t) - t2m9(b.t));
      let L = 0, pl = 0, peak = 0, worst = 0, run = 0, maxRun = 0, skipped = 0, stopped = false;
      const steps = [];
      for (const e of seq) {
        if (pl >= 1000) { stopped = true; break; }
        if (e.bd == null) { skipped++; continue; }
        const s = Math.round((L + 10) / (e.bd - 1) * 100) / 100;
        peak = Math.max(peak, s);
        if (e.bw) { pl += 10; L = 0; run = 0;
          steps.push(`${e.t} \u00a3${s.toFixed(2)} @ ${e.bd} <span class="p1">\u2713</span> <small>bank ${pl >= 0 ? '+' : ''}\u00a3${pl.toFixed(2)}</small>`); }
        else { L += s; run++; maxRun = Math.max(maxRun, run); worst = Math.min(worst, pl - L);
          steps.push(`${e.t} \u00a3${s.toFixed(2)} @ ${e.bd} <span class="pbad">\u2717</span> <small>down \u00a3${L.toFixed(2)}</small>`); }
      }
      const final = pl - L;
      if (!steps.length) return '';
      return `<div class="mart"><div class="mh">MARTINGALE REPLAY \u00b7 \u00a310/cycle on ULTRA #1, this day's actual sequence${stopped ? ' \u00b7 stopped at +\u00a31000' : ''}</div>${
        steps.map(s9 => `<div class="mln">${s9}</div>`).join('')
      }<div class="msum">final <b style="color:${final >= 0 ? 'var(--grn)' : 'var(--red)'}">${final < 0 ? '\u2212' : '+'}\u00a3${Math.abs(final).toFixed(2)}</b> \u00b7 peak stake <b>\u00a3${peak.toFixed(2)}</b> \u00b7 worst hole <b>\u00a3${Math.abs(worst).toFixed(2)}</b> \u00b7 longest run <b>${maxRun}\u2717</b>${L > 0 ? ` \u00b7 <span class="pbad">ends mid-ladder, \u00a3${L.toFixed(2)} unrecovered</span>` : ''}${skipped ? ` \u00b7 ${skipped} no-odds skipped` : ''}</div></div>`;
    })();
    return `<div class="utile"><div class="hd2">${d === todayK ? 'TODAY' : d}</div>${mart}${rows}</div>`;
  }).join('');
  $('app').innerHTML = tiles + campaign +
    `<div class="note">Every winner's score from the full-card rank table: position in the race's rank order, gold rank-sum total (lower = stronger convergence), and its rank in each signal. ULTRA #1 = the table's top line won. Missing signal counts worst in the total. £1 line backs the ULTRA #1 in every race at the terminal's recorded price — strike is the product, this is just the receipt.</div>` +
    dayBlocks;
  $('upd').textContent = `${races} winners scored · ${days.length} day${days.length === 1 ? '' : 's'} · built ` +
    new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' }).format(new Date());
}
boot().catch(e => { $('upd').innerHTML = '<span class="err">failed: ' + e + '</span>'; });
</script>
</body>
</html>
