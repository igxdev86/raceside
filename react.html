<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REACT — RACESIDE</title>
<script src="/nav.js" defer></script>
<style>
:root{--ubg:#070B12;--upanel:#0D1420;--upanel2:#111B2B;--uline:#1C2940;--uline2:#27395C;
--uink:#E8EEF7;--udim:#9FB2CC;--ufaint:#6B7E9A;--cy:#00D1FF;--am:#FFB300;--grn:#00E676;--lumo:#39FF14;--red:#FF3B5C;
--umono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--ucond:-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%}
html body{background:var(--ubg)!important;color:var(--uink)!important;font-family:var(--ucond);padding:12px 10px 60px}
body .wrap{max-width:760px;margin:0}
h1{font-size:24px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
background:linear-gradient(90deg,var(--cy),var(--lumo));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
.usub{font-size:11px;letter-spacing:.18em;color:var(--ufaint);font-weight:800;margin:4px 0 12px}
.usub a{color:var(--ufaint);text-decoration:none}
.upd2{font-family:var(--umono);font-size:10.5px;color:var(--cy);margin:2px 0 12px}
.utile{background:var(--upanel);border:1px solid var(--uline);border-left:3px solid var(--cy);border-radius:8px;padding:11px 12px;margin:0 0 10px}
.utile .hd2{font-size:11px;letter-spacing:.2em;font-weight:900;color:var(--cy);text-transform:uppercase;margin-bottom:7px}
.utile.nxt{border:1px solid var(--lumo);border-left:4px solid var(--lumo);box-shadow:0 0 18px rgba(57,255,20,.08)}
.utile.nxt .hd2{color:var(--lumo)}
.rrow9{font-family:var(--umono);font-size:12px;line-height:1.9;padding:7px 0;border-bottom:1px solid var(--uline)}
.rrow9:last-child{border-bottom:0}
.rrow9 .hname{color:var(--lumo);font-weight:900;font-size:13px}
.rrow9 small{color:var(--ufaint)}
.rrow9 .est{font-weight:900;font-size:15px}
.rrow9 .mkt{color:var(--udim)}
.rrow9 .cmb{display:block;color:var(--udim);font-size:10.5px;line-height:1.9}
.rrow9 .cmb b{color:#C7D3E4}
.bar{height:5px;background:var(--upanel2);border:1px solid var(--uline);border-radius:3px;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--lumo))}
.unote{font-family:var(--umono);font-size:10.5px;color:var(--ufaint);line-height:1.7;margin:0 0 14px}
.unote b{color:var(--am)}
.err{color:var(--red);font-family:var(--umono);font-size:11px}
</style>
</head>
<body>
<div class="wrap">
<h1>REACT</h1>
<div class="usub">NEXT PICKS × WIN LIKELIHOOD · <a href="/maxterminalx.html">&larr; TERMINAL X</a></div>
<div class="upd2" id="upd">loading…</div>
<div id="app"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const dayKey = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date());
const t2m9 = (t) => { const m = String(t || '').match(/(\d{1,2})[:.](\d{2})/); if (!m) return 0;
  let hh = +m[1]; if (hh < 11) hh += 12; return hh * 60 + (+m[2]); };
const nowM = () => { const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()).split(':');
  return (+p[0]) * 60 + (+p[1]); };

async function boot() {
  const getState = async () => { try {
    const r = await fetch('/api/yearstate?k=comboledger:v1&t=' + Date.now()); const j = await r.json();
    return (j && j.state) || null; } catch { return null; } };
  let st = await getState();
  const today = dayKey();
  const fresh = (s) => s && s.days && s.days[today] && s.days[today].nx && Object.keys(s.days[today].nx).length
    && s.ts && (Date.now() - s.ts < 10 * 60 * 1000);
  if (!fresh(st)) {
    $('upd').textContent = 'reading the live board — TERMINAL X engine running…';
    const fr = document.createElement('iframe');
    fr.src = '/maxterminalx.html'; fr.style.cssText = 'position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-9999px';
    document.body.appendChild(fr);
    const t0 = Date.now();
    for (let w9 = 0; w9 < 15; w9++) {
      await new Promise(r9 => setTimeout(r9, 4000));
      $('upd').textContent = `reading the live board… ${Math.round((Date.now() - t0) / 1000)}s`;
      const s2 = await getState();
      if (fresh(s2)) { st = s2; break; }
      if (s2) st = s2;
    }
    fr.remove();
  }
  const days = (st && st.days) || {};
  const nx = (days[today] && days[today].nx) || {};
  // aggregate every banked day's scanner records
  const agS = {};
  Object.values(days).forEach(dv => ((dv && dv.scan) || []).forEach(r9 => { if (!r9 || !r9.nm) return;
    const g = agS[r9.nm] = agS[r9.nm] || { w: 0, n: 0 }; g.w += r9.w || 0; g.n += r9.n || 0; }));
  const dayN = Object.keys(days).length;
  // full time-ordered W/L sequence per tile across all banked days
  const seqOf = {};
  Object.keys(days).sort().forEach(d9 => { const sq9 = days[d9] && days[d9].sq;
    if (sq9) Object.entries(sq9).forEach(([nm, s9]) => { seqOf[nm] = (seqOf[nm] || '') + s9; }); });
  const streakOf = (nm) => { const s9 = seqOf[nm] || ''; let L9 = 0;
    for (let i9 = s9.length - 1; i9 >= 0 && s9[i9] === 'L'; i9--) L9++; return L9; };
  const afterRun = (nm, L9) => { // historically, after >=L9 straight losses, how often did the NEXT bet win?
    const s9 = seqOf[nm] || ''; let run9 = 0, won9 = 0, tot9 = 0;
    for (let i9 = 0; i9 < s9.length; i9++) {
      if (run9 >= L9 && L9 > 0) { tot9++; if (s9[i9] === 'W') won9++; }
      run9 = s9[i9] === 'L' ? run9 + 1 : 0; }
    return { won9, tot9 }; };
  // tile-first: every banked tile/combo with a live next pick
  const live = Object.entries(nx).filter(([, v]) => v && v.h && t2m9(v.t) >= nowM() - 2);
  const rows = live.map(([nm, v]) => {
    const rec = agS[nm] || { w: 0, n: 0 };
    const oneIn = rec.w > 0 ? rec.n / rec.w : null;
    let est = (rec.w + 1) / (rec.n + 2);
    const stk = streakOf(nm);
    const ar = stk > 0 ? afterRun(nm, stk) : { won9: 0, tot9: 0 };
    let dueTxt = '';
    if (stk > 0) {
      dueTxt = `${stk}\u2717 since a win`;
      if (ar.tot9 >= 3) { est = (ar.won9 + 1) / (ar.tot9 + 2);
        dueTxt += ` \u00b7 after ${stk}\u2717 the next one won <b>${ar.won9}/${ar.tot9}</b> historically`; }
      else if (oneIn != null) dueTxt += ` \u00b7 typical gap ${Math.round(oneIn * 10) / 10}`;
    }
    const imp = v.d > 1 ? 1 / v.d : null;
    return { nm, ...v, w: rec.w, n: rec.n, oneIn, est, imp, stk, dueTxt };
  }).sort((a, b) => (a.oneIn == null ? 1 : 0) - (b.oneIn == null ? 1 : 0) || (a.oneIn || 99) - (b.oneIn || 99) || b.n - a.n);
  const pcf = (v) => Math.round(v * 100);
  const fmt1 = (v) => { const r = Math.round(v * 10) / 10; return r === Math.round(r) ? String(Math.round(r)) : r.toFixed(1); };
  const html = rows.map((g, i9) => {
    const edge = g.imp != null ? g.est - g.imp : null;
    return `<div class="utile${i9 === 0 ? ' nxt' : ''}"><div class="hd2">${g.nm} ${i9 === 0 ? '\u00b7 best tile live' : ''}</div>
      <div class="rrow9">
      <span class="est" style="color:${g.oneIn == null ? 'var(--udim)' : 'var(--lumo)'}">${g.oneIn != null ? 'wins 1 in ' + fmt1(g.oneIn) : 'no wins banked yet'}</span>
      <small> \u00b7 ${g.w}/${g.n} across the record${g.n ? ' (' + pcf(g.w / Math.max(g.n, 1)) + '%)' : ''}</small>
      ${g.dueTxt ? `<span class="cmb" style="color:${g.stk >= (g.oneIn || 9) ? 'var(--am)' : 'var(--udim)'}">${g.dueTxt}</span>` : ''}
      <div class="bar"><i style="width:${g.n ? pcf(g.w / g.n) : 0}%"></i></div>
      next pick: <span class="hname">${g.h}</span>${g.d != null ? ` <small>@ ${g.d}</small>` : ''} <small>\u00b7 ${g.t}</small>
      ${g.imp != null ? `<span class="cmb">market says ${pcf(g.imp)}% for this one \u00b7 record says ${pcf(g.est)}% \u00b7 <b style="color:${edge > 0 ? 'var(--grn)' : 'var(--red)'}">${edge > 0 ? '+' : ''}${pcf(edge)}</b></span>` : ''}
      </div></div>`;
  }).join('');
  const liveNames = new Set(rows.map(r => r.nm));
  const rest = Object.entries(agS).filter(([nm, g]) => !liveNames.has(nm) && g.n > 0)
    .map(([nm, g]) => ({ nm, ...g, oneIn: g.w > 0 ? g.n / g.w : null }))
    .sort((a, b) => (a.oneIn == null ? 1 : 0) - (b.oneIn == null ? 1 : 0) || (a.oneIn || 99) - (b.oneIn || 99) || b.n - a.n);
  const restHtml = rest.length ? `<div class="utile" style="border-left-color:var(--uline2)"><div class="hd2" style="color:var(--udim)">${rows.length ? 'No live pick right now \u2014 record only' : 'Racing done \u2014 every tile\u2019s record'}</div>${
    rest.map(g => `<div class="rrow9" style="padding:3px 0"><b style="color:#C7D3E4">${g.nm}</b> <small>\u2014</small> ${g.oneIn != null ? `<b style="color:var(--lumo)">wins 1 in ${Math.round(g.oneIn * 10) / 10}</b>` : '<small>no wins yet</small>'} <small>\u00b7 ${g.w}/${g.n} (${Math.round(g.w / g.n * 100)}%)</small>${streakOf(g.nm) > 0 ? ` <b style="color:${streakOf(g.nm) >= (g.oneIn || 9) ? 'var(--am)' : 'var(--ufaint)'};font-size:10.5px">${streakOf(g.nm)}\u2717 running</b>` : ''}</div>`).join('')
  }</div>` : '';
  const html2 = rows.length ? html : '';
  $('app').innerHTML = html2 + restHtml +
    `<div class="unote">Each tile's banked record as plain frequency \u2014 <b>wins 1 in N</b> \u2014 from ${dayN} day${dayN === 1 ? '' : 's'} of the frozen record, with its next live pick. Record % is raw; the per-horse % is smoothed ((w+1)/(n+2)). A 1-in-2 from four races is luck until it is a 1-in-2 from forty. The due line shows where a tile sits in its losing run against its typical gap, and when the record holds enough cases, the estimate switches to what actually happened after runs that long \u2014 measured, not assumed. ${dayN < 7 ? '<b>Early days.</b>' : ''}</div>`;
  $('upd').textContent = rows.length + ' live pick' + (rows.length === 1 ? '' : 's') + ' · built ' +
    new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' }).format(new Date());
}
boot().catch(e => { $('upd').innerHTML = '<span class="err">failed: ' + e + '</span>'; });
</script>
</body>
</html>
