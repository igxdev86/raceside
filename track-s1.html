<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRACK S1</title>
<style>
:root{--bg:#06080D;--ink:#F2F5FA;--dim:#8C9AB0;--faint:#4E5A6E;--line:#151B26;--lumo:#39FF14;--red:#FF3B5C;--am:#FFB300;
--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--sans:-apple-system,"Helvetica Neue",Inter,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);padding:28px 18px 80px;max-width:640px}
.sig{font-family:var(--mono);font-size:13px;letter-spacing:.3em;color:var(--lumo);font-weight:700}
.rec{font-family:var(--mono);font-size:44px;font-weight:900;line-height:1.05;margin:10px 0 2px;letter-spacing:-.02em}
.rec small{font-size:16px;color:var(--dim);font-weight:700;letter-spacing:0;margin-left:8px}
.meta{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.8;margin-bottom:26px}
.meta b{color:var(--ink)}
.meta .seq{letter-spacing:.14em;word-break:break-all}
.day{margin:22px 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;display:flex;justify-content:space-between}
.pk{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.pk .t{font-family:var(--mono);font-size:12px;color:var(--dim)}
.pk .t small{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.1em}
.pk .h{font-size:17px;font-weight:800;letter-spacing:-.01em}
.pk .h small{font-family:var(--mono);font-size:11.5px;color:var(--dim);font-weight:600;margin-left:6px}
.pk .h .lost{display:block;font-size:11px;color:var(--faint);font-weight:500;margin-top:1px}
.pk .r{font-family:var(--mono);font-size:12px;font-weight:900;letter-spacing:.08em;white-space:nowrap}
.pk.w .r{color:var(--lumo)} .pk.w .h{color:var(--lumo)}
.pk.l .r{color:var(--red)} .pk.l .h{color:var(--ink);opacity:.55}
.pk.p .r{color:var(--am)} .pk.p .h{color:var(--ink)}
.empty{font-family:var(--mono);font-size:12px;color:var(--faint);line-height:1.8;margin-top:30px}
</style>
</head>
<body>

<div id="smenu" style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;font-family:var(--mono)"></div>
<script>
window.__renderMenu = (days, cur) => {
  const fixed = [ ['S1', '\u03a3+MN+MX', '/track-s1.html?s=%CE%A3%2BMN%2BMX&n=S1'], ['S2', 'FAV+TM+OR', '/track.html?s=FAV%2BTM%2BOR&n=S2'],
    ['S3', 'J #1+T #1', '/track.html?s=J%20%231%2BT%20%231&n=S3'], ['S4', 'MX', '/track-s1.html?s=MX&n=S4'], ['S5', 'MN', '/track-s1.html?s=MN&n=S5'] ];
  const ag = {}; Object.values(days || {}).forEach(dv => ((dv && dv.scan) || []).forEach(r => { if (!r || !r.nm) return; const g = ag[r.nm] = ag[r.nm] || { w: 0, n: 0 }; g.w += r.w || 0; g.n += r.n || 0; }));
  const wil = (w, n) => { if (!n) return 0; const z = 1.96, p = w / n; return (p + z * z / (2 * n) - z * Math.sqrt((p * (1 - p) + z * z / (4 * n)) / n)) / (1 + z * z / n); };
  const fixedNames = new Set(fixed.map(f => f[1]));
  const more = Object.entries(ag).filter(([nm, g]) => g.n >= 5 && !fixedNames.has(nm)).map(([nm, g]) => ({ nm, ...g, lb: wil(g.w, g.n) }))
    .sort((a, b) => b.lb - a.lb).slice(0, 10);
  const chip = (lbl, nm, href, sub) => `<a href="${href}" style="text-decoration:none;border:1px solid ${nm === cur ? 'var(--lumo)' : 'var(--line)'};color:${nm === cur ? 'var(--lumo)' : 'var(--dim)'};border-radius:6px;padding:5px 9px;font-size:10.5px;letter-spacing:.08em;line-height:1.5"><b>${lbl}</b> ${nm}${sub ? `<br><span style="color:var(--faint);font-size:9.5px">${sub}</span>` : ''}</a>`;
  document.getElementById('smenu').innerHTML = fixed.map(f => chip(f[0], f[1], f[2], ag[f[1]] ? `${ag[f[1]].w}/${ag[f[1]].n}` : '')).join('') +
    more.map((m, i) => chip('X' + (i + 1), m.nm, '/track-s1.html?s=' + encodeURIComponent(m.nm) + '&n=X' + (i + 1), `${m.w}/${m.n} \u00b7 ${Math.round(m.w / m.n * 100)}%`)).join('');
};
</script>
<div class="sig" id="sig">S1 · Σ+MN+MX</div>
<div class="rec" id="rec">—</div>
<div class="meta" id="meta">loading…</div>
<div id="list"></div>
<script>
const SIGNAL = new URLSearchParams(location.search).get('s') || 'Σ+MN+MX';
const LABEL = new URLSearchParams(location.search).get('n') || 'S1';
const $ = (id) => document.getElementById(id);
const t2m = (t) => { const m = String(t || '').match(/(\d{1,2})[:.](\d{2})/); if (!m) return 0; let hh = +m[1]; if (hh < 11) hh += 12; return hh * 60 + (+m[2]); };
const abbr = (c) => String(c || '').replace(/\s*\([^)]*\)/g, '').trim();
(async () => {
  $('sig').textContent = LABEL + ' · ' + SIGNAL;
  const ukd = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date());
  const getSt = async () => { try { const r = await fetch('/api/yearstate?k=comboledger:v1&t=' + Date.now()); const j = await r.json(); return j && j.state; } catch { return null; } };
  let st = await getSt();
  const hasToday = (s) => !!(s && s.days && s.days[ukd] && (s.days[ukd].v || 0) >= 2 && s.days[ukd].tp && Array.isArray(s.days[ukd].tp[SIGNAL]));
  if (!hasToday(st)) {
    $('meta').textContent = 'pulling today\u2019s picks from the terminal\u2026';
    const fr = document.createElement('iframe');
    fr.src = '/maxterminalx.html'; fr.style.cssText = 'position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-9999px';
    document.body.appendChild(fr);
    const t0 = Date.now();
    for (let i = 0; i < 15; i++) {
      await new Promise(r => setTimeout(r, 4000));
      $('meta').textContent = `pulling today\u2019s picks from the terminal\u2026 ${Math.round((Date.now() - t0) / 1000)}s`;
      const s2 = await getSt(); if (hasToday(s2)) { st = s2; break; } if (s2) st = s2;
    }
    fr.remove();
  }
  const days = (st && st.days) || {};
  try { window.__renderMenu(days, SIGNAL); } catch {}
  // all-time record from the aggregate scanner entries (every banked day), sequence from sq
  let W = 0, N = 0, SQ = '';
  Object.keys(days).sort().forEach(d => { const dv = days[d] || {};
    const r = (dv.scan || []).find(x => x && x.nm === SIGNAL); if (r) { W += r.w || 0; N += r.n || 0; }
    if (dv.sq && dv.sq[SIGNAL]) SQ += dv.sq[SIGNAL]; });
  let cur = 0; for (let i = SQ.length - 1; i >= 0 && SQ[i] === 'L'; i--) cur++;
  let mx = 0, run = 0; for (const c of SQ) { if (c === 'L') { run++; mx = Math.max(mx, run); } else run = 0; }
  $('rec').innerHTML = N ? `${W}/${N}<small>${Math.round(W / N * 100)}%</small>` : '—';
  $('meta').innerHTML = N ? `<b>${Object.keys(days).length}</b> days banked · longest losing run <b>${mx}</b> · current <b style="color:${cur ? 'var(--red)' : 'var(--lumo)'}">${cur}✗</b><br><span class="seq">${[...SQ].map(c => c === 'W' ? '<b style="color:var(--lumo)">W</b>' : '<span style="color:var(--red)">L</span>').join('')}</span>` : 'no record yet';
  // THIS MONTH: every banked day, newest first. Picks listed where stored; score line where only the tally exists.
  const month = ukd.slice(0, 7);
  const monthName = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', month: 'long' }).format(new Date()).toUpperCase();
  const mDays = Object.keys(days).filter(d => d.startsWith(month)).sort().reverse();
  if (!mDays.length) { $('list').innerHTML = `<div class="empty">Nothing banked for ${monthName} yet.</div>`; return; }
  let mw = 0, mn = 0;
  const blocks = mDays.map(d => {
    const dv = days[d] || {};
    const rec = (dv.scan || []).find(x => x && x.nm === SIGNAL);
    if (rec) { mw += rec.w || 0; mn += rec.n || 0; }
    const raw = (dv.tp && dv.tp[SIGNAL]) || [];
    const seen = new Set();
    const picks = raw.filter(p => { const k = p.t + '|' + p.c; if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => (a.w === null ? 0 : 1) - (b.w === null ? 0 : 1) || t2m(a.t) - t2m(b.t));
    const hdr = `<div class="day"><span>${d === ukd ? 'today' : d.slice(5)}</span><span>${rec && rec.n ? `${rec.w}/${rec.n}` : ''}</span></div>`;
    if (!picks.length) return hdr + `<div class="empty" style="margin:6px 0 4px">${rec && rec.n ? 'score banked \u00b7 horse names were not stored before 9 Oct' : 'no agreement races'}</div>`;
    return hdr + picks.map(p => `<div class="pk ${p.w === null ? 'p' : p.w ? 'w' : 'l'}"><div class="t">${p.t}<small>${abbr(p.c).slice(0, 10)}</small></div><div class="h">${p.h}${p.d != null ? `<small>@ ${p.d}</small>` : ''}${p.w === 0 && p.wn ? `<span class="lost">won by ${p.wn}</span>` : ''}</div><div class="r">${p.w === null ? 'TO RUN' : p.w ? 'WON' : 'LOST'}</div></div>`).join('');
  }).join('');
  $('list').innerHTML = `<div class="day" style="margin-top:4px;color:var(--lumo)"><span>${monthName}</span><span>${mn ? `${mw}/${mn} \u00b7 ${Math.round(mw / mn * 100)}%` : ''}</span></div>` + blocks;
})();
</script>
</body>
</html>
