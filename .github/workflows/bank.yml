name: cloud banker
on:
  schedule:
    # safety net only - the chain below keeps itself alive; GitHub cron is best-effort and often late or missing
    - cron: '0 10-21 * * *'
    - cron: '30 10-21 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: banker
  cancel-in-progress: false
jobs:
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.47.2-jammy
    steps:
      - uses: actions/checkout@v4
      # queue the next lap first: it waits in the concurrency group and starts the moment this one ends, so the banker never relies on cron
      - name: queue next lap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # always queue the next lap: GitHub cron proved unreliable for restarting the chain in the morning, so the chain never stops (public repo - minutes are free)
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/bank.yml/dispatches" -d '{"ref":"main"}' && echo "next lap queued"
      - run: npm init -y >/dev/null && npm install playwright@1.47.2 --no-audit --no-fund --silent
      - run: node scripts/bank.mjs
        env:
          RUN_MINUTES: '57'
