name: probe
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to fetch
        required: true
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: fetch and publish to probe branch
        run: |
          mkdir -p /tmp/p && curl -sS --max-time 60 "${{ github.event.inputs.url }}" -o /tmp/p/out.json || echo '{"probe":"fetch-failed"}' > /tmp/p/out.json
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git checkout --orphan probe && git rm -rf -q . && cp /tmp/p/out.json out.json && date -u > fetched_at.txt
          git add out.json fetched_at.txt && git commit -q -m "probe $(date -u +%FT%TZ)" && git push -f origin probe
