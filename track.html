<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRACK</title>
<style>
:root{--bg:#06080D;--ink:#F2F5FA;--dim:#8C9AB0;--faint:#4E5A6E;--line:#151B26;--lumo:#39FF14;--red:#FF3B5C;--am:#FFB300;
--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--sans:-apple-system,"Helvetica Neue",Inter,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);padding:28px 18px 80px;max-width:640px}
.sig{font-family:var(--mono);font-size:13px;letter-spacing:.3em;color:var(--lumo);font-weight:700}
.rec{font-family:var(--mono);font-size:44px;font-weight:900;line-height:1.05;margin:10px 0 2px;letter-spacing:-.02em}
.rec small{font-size:16px;color:var(--dim);font-weight:700;letter-spacing:0;margin-left:8px}
.meta{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.8;margin-bottom:26px}
.meta b{color:var(--ink)}
.meta .seq{letter-spacing:.14em;word-break:break-all}
.day{margin:22px 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;display:flex;justify-content:space-between}
.pk{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.pk .t{font-family:var(--mono);font-size:12px;color:var(--dim)}
.pk .t small{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.1em}
.pk .h{font-size:17px;font-weight:800;letter-spacing:-.01em}
.pk .h small{font-family:var(--mono);font-size:11.5px;color:var(--dim);font-weight:600;margin-left:6px}
.pk .h .lost{display:block;font-size:11px;color:var(--faint);font-weight:500;margin-top:1px}
.pk .r{font-family:var(--mono);font-size:12px;font-weight:900;letter-spacing:.08em;white-space:nowrap}
.pk.w .r{color:var(--lumo)} .pk.w .h{color:var(--lumo)}
.pk.l .r{color:var(--red)} .pk.l .h{color:var(--ink);opacity:.55}
.empty{font-family:var(--mono);font-size:12px;color:var(--faint);line-height:1.8;margin-top:30px}
</style>
</head>
<body>


<script>
// rebuild any finished day this month that predates the 13-signal scanner (v<2 or no named picks), oldest first
window.__rebuildStale = async (days, getSt, onMsg) => {
  const ukd = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date());
  const month = ukd.slice(0, 7);
  const stale = Object.keys(days || {}).filter(d => d.startsWith(month) && d < ukd && (((days[d] && days[d].v) || 0) < 2 || (days[d] && days[d].gone == null))).sort();
  let latest = days;
  for (const d of stale.slice(0, 6)) {
    onMsg && onMsg(`rebuilding ${d} from the results feed\u2026`);
    const fr = document.createElement('iframe'); fr.src = '/maxterminalx.html?date=' + d; fr.style.cssText = 'position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-9999px';
    document.body.appendChild(fr);
    for (let i = 0; i < 15; i++) { await new Promise(r => setTimeout(r, 4000)); const s2 = await getSt(); const dz = s2 && s2.days;
      if (dz && dz[d] && (dz[d].v || 0) >= 2 && dz[d].gone != null) { latest = dz; break; } if (dz) latest = dz; }
    fr.remove();
  }
  return latest;
};
</script>

<script>
window.__keepBanking = () => { if (document.getElementById('bankfr')) return;
  const fr = document.createElement('iframe'); fr.id = 'bankfr'; fr.src = '/maxterminalx.html?bg=1'; fr.style.cssText = 'position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-9999px';
  document.body.appendChild(fr); };
</script>
<div id="smenu" style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;font-family:var(--mono)"></div>
<script>
  const D = { '\u03a3': 'model score leader', 'TM': 'top weight-adjusted rating', 'MN': 'biggest steamer vs model price', 'PWR': 'POWER composite leader', 'MX': 'lowest score\u00d7price', 'JT': 'top jockey+trainer strike',
    'FAV': 'clear favourite', 'OR': 'top official rating', 'PTS': 'print points leader', 'GRN': 'greenest painted', 'EDGE': 'rating leader thrown in vs OR', 'CD': 'course & distance winner', 'DRW': 'lowest stall', 'PUMP': 'biggest upward mover', 'LWT': 'lowest weight carried (flat only)',
    'FAV+TM+OR': 'favourite that is also top rating and top OR', 'J #1+T #1': 'top jockey and top trainer on one horse' };
  window.__describe = (nm) => D[nm] || nm.split('+').map(k => D[k] || k).join(' + ');
window.__renderMenu = (days, cur) => {
  const fixed = [ ['S1', '\u03a3+MN+MX', '/track-s1.html?s=%CE%A3%2BMN%2BMX&n=S1'], ['S2', 'FAV+TM+OR', '/track.html?s=FAV%2BTM%2BOR&n=S2'],
    ['S3', 'J #1+T #1', '/track.html?s=J%20%231%2BT%20%231&n=S3'], ['S4', 'MX', '/track-s1.html?s=MX&n=S4'], ['S5', 'MN', '/track-s1.html?s=MN&n=S5'] ];
  const ag = {}; Object.values(days || {}).forEach(dv => ((dv && dv.scan) || []).forEach(r => { if (!r || !r.nm) return; const g = ag[r.nm] = ag[r.nm] || { w: 0, n: 0 }; g.w += r.w || 0; g.n += r.n || 0; }));
  const wil = (w, n) => { if (!n) return 0; const z = 1.96, p = w / n; return (p + z * z / (2 * n) - z * Math.sqrt((p * (1 - p) + z * z / (4 * n)) / n)) / (1 + z * z / n); };
  const fixedNames = new Set(fixed.map(f => f[1]));
  const more = Object.entries(ag).filter(([nm, g]) => g.n >= 5 && !fixedNames.has(nm)).map(([nm, g]) => ({ nm, ...g, lb: wil(g.w, g.n) }))
    .sort((a, b) => b.lb - a.lb).slice(0, 10);
  const chip = (lbl, nm, href, sub) => `<a title="${window.__describe(nm)}" href="${href}" style="text-decoration:none;border:1px solid ${nm === cur ? 'var(--lumo)' : 'var(--line)'};color:${nm === cur ? 'var(--lumo)' : 'var(--dim)'};border-radius:6px;padding:5px 9px;font-size:10.5px;letter-spacing:.08em;line-height:1.5"><b>${lbl}</b> ${nm}${sub ? `<br><span style="color:var(--faint);font-size:9.5px">${sub}</span>` : ''}<br><span style="color:var(--faint);font-size:9px;letter-spacing:0;font-family:var(--sans)">${window.__describe(nm)}</span></a>`;
  { const e = document.getElementById('sigdesc'); if (e) e.textContent = window.__describe(cur); }
  document.getElementById('smenu').innerHTML = `<a href="https://betfair.mediaondemand.net/?sport=horses&theme=dark&playerbg=ffb80c&highlights=0&queuebuttoncolor=fff&showmenu" target="_blank" rel="noopener" style="text-decoration:none;border:1px solid var(--am);color:var(--am);border-radius:6px;padding:5px 9px;font-size:10.5px;letter-spacing:.08em;line-height:1.5"><b>\u25b6 RACING RADIO</b><br><span style="color:var(--faint);font-size:9px;letter-spacing:0;font-family:var(--sans)">live commentary</span></a>` + fixed.map(f => chip(f[0], f[1], f[2], ag[f[1]] ? `${ag[f[1]].w}/${ag[f[1]].n}` : '')).join('') +
    more.map((m, i) => chip('X' + (i + 1), m.nm, '/track-s1.html?s=' + encodeURIComponent(m.nm) + '&n=X' + (i + 1), `${m.w}/${m.n} \u00b7 ${Math.round(m.w / m.n * 100)}%`)).join('');
};
</script>

<div id="sigdesc" style="font-family:var(--sans);font-size:13px;color:var(--dim);margin-top:6px"></div>

<script>
window.__renderTomorrow = async (days, SIGNAL, getSt) => {
  const tmr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date(Date.now() + 86400000));
  const t2m = (t) => { const m = String(t || '').match(/(\d{1,2})[:.](\d{2})/); if (!m) return 0; let hh = +m[1]; if (hh < 11) hh += 12; return hh * 60 + (+m[2]); };
  const has = (dz) => !!(dz && dz[tmr] && dz[tmr].tp);
  const box = document.getElementById('tmrw');
  if (!has(days)) {
    box.innerHTML = '<div class="day" style="color:var(--am)"><span>tomorrow</span><span>reading the card\u2026</span></div>';
    const fr = document.createElement('iframe'); fr.src = '/maxterminalx.html?day=tomorrow'; fr.style.cssText = 'position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-9999px';
    document.body.appendChild(fr);
    for (let i = 0; i < 12; i++) { await new Promise(r => setTimeout(r, 4000)); const s2 = await getSt(); if (has(s2 && s2.days)) { days = s2.days; break; } }
    fr.remove();
  }
  const all = (days[tmr] && days[tmr].tp) || {};
  const mine = (all[SIGNAL] || []).slice().sort((a, b) => t2m(a.t) - t2m(b.t));
  const fixedNames = ['\u03a3+MN+MX', 'FAV+TM+OR', 'J #1+T #1', 'MX', 'MN'];
  const others = Object.entries(all).filter(([nm, arr]) => nm !== SIGNAL && arr && arr.length && (fixedNames.includes(nm) || nm.includes('+'))).sort((a, b) => b[1].length - a[1].length).slice(0, 12);
  const row = (p) => `<div class="pk p"><div class="t">${p.t}<small>${String(p.c || '').replace(/\s*\([^)]*\)/g, '').slice(0, 10)}</small></div><div class="h">${p.h}${p.d != null ? `<small>@ ${p.d}</small>` : ''}</div><div class="r">TO RUN</div></div>`;
  box.innerHTML = `<div class="day" style="color:var(--am);margin-top:28px"><span>tomorrow \u00b7 ${SIGNAL}</span><span>${mine.length} pick${mine.length === 1 ? '' : 's'}</span></div>` +
    (mine.length ? mine.map(row).join('') : '<div class="empty" style="margin:6px 0">no agreement on tomorrow\u2019s card yet \u2014 prices firm up through the morning</div>') +
    (others.length ? `<div class="day" style="margin-top:22px"><span>tomorrow \u00b7 other chips</span><span></span></div>` + others.map(([nm, arr]) => `<div style="font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.9;padding:4px 0;border-bottom:1px solid var(--line)"><b style="color:var(--ink)">${nm}</b> <small style="color:var(--faint)">${window.__describe ? window.__describe(nm) : ''}</small><br>${arr.slice().sort((a, b) => t2m(a.t) - t2m(b.t)).map(p => `${p.t} <span style="color:var(--lumo);font-weight:800">${p.h}</span>${p.d != null ? ' <small>@ ' + p.d + '</small>' : ''}`).join(' \u00b7 ')}</div>`).join('') : '');
};
</script>

<script>
const Q = new URLSearchParams(location.search);
const SIGNAL = Q.get('s') || 'FAV+TM+OR';
const LABEL = Q.get('n') || 'S2';
const $ = (id) => document.getElementById(id);
const hn = (s) => String(s || '').toLowerCase().replace(/\s*\([a-z]{2,3}\)\s*$/i, '').trim();
const tK = (t) => { const m = String(t || '').trim().match(/(\d{1,2})[:.](\d{2})/); if (!m) return String(t || '').trim(); let hh = +m[1]; if (hh > 12) hh -= 12; return hh + ':' + m[2]; };
const ck0 = (c) => String(c || '').replace(/\s*\([^)]*\)/g, '').trim().toLowerCase();
const t2m = (t) => { const m = String(t || '').match(/(\d{1,2})[:.](\d{2})/); if (!m) return 0; let hh = +m[1]; if (hh < 11) hh += 12; return hh * 60 + (+m[2]); };
const abbr = (c) => String(c || '').replace(/\s*\([^)]*\)/g, '').trim();
(async () => {
  const gj = (u) => fetch(u).then(r => r.json()).catch(() => null);
  const ukd = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date());
  const month = /^\d{4}-\d{2}$/.test(Q.get('m') || '') ? Q.get('m') : ukd.slice(0, 7);
  const mDate = new Date(month + '-15T12:00:00Z');
  const monthName = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', month: 'long', year: 'numeric' }).format(mDate).toUpperCase();
  const shift = (k) => { const d = new Date(mDate); d.setUTCMonth(d.getUTCMonth() + k); return d.toISOString().slice(0, 7); };
  const shortM = (mm) => new Intl.DateTimeFormat('en-GB', { month: 'short' }).format(new Date(mm + '-15T12:00:00Z')).toUpperCase();
  const mLink = (mm, lbl) => { const q = new URLSearchParams(location.search); q.set('m', mm); return `<a href="?${q}" style="color:var(--dim);text-decoration:none;font-family:var(--mono);font-size:11px;letter-spacing:.14em">${lbl}</a>`; };
  $('sig').innerHTML = `${LABEL} \u00b7 ${SIGNAL} <span style="float:right">${mLink(shift(-1), '\u2190 ' + shortM(shift(-1)))} &nbsp; ${shift(1) <= ukd.slice(0, 7) ? mLink(shift(1), shortM(shift(1)) + ' \u2192') : ''}</span>`;
  const [jA, jArch, jP, jL] = await Promise.all([ gj('/api/yearstate?k=alertstate:v1&t=' + Date.now()), gj('/api/yearstate?k=printsarchive:v1&t=' + Date.now()), gj('/api/peopleall?v=2'), gj('/api/yearstate?k=comboledger:v1&t=' + Date.now()) ]);
  let stX = jL && jL.state;
  const getStX = async () => { try { const r = await fetch('/api/yearstate?k=comboledger:v1&t=' + Date.now()); const j = await r.json(); return j && j.state; } catch { return null; } };
  const freshX = (s) => !!(s && s.days && s.days[ukd] && (s.days[ukd].v || 0) >= 2);
  if (!freshX(stX)) {
    const fr = document.createElement('iframe'); fr.src = '/maxterminalx.html'; fr.style.cssText = 'position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-9999px';
    document.body.appendChild(fr);
    for (let i = 0; i < 15; i++) { await new Promise(r => setTimeout(r, 4000)); const s2 = await getStX(); if (freshX(s2)) { stX = s2; break; } if (s2) stX = s2; }
    fr.remove();
  }
  { const dz = await window.__rebuildStale((stX && stX.days) || {}, getStX, (m) => { $('meta').textContent = m; }); if (dz) stX = Object.assign({}, stX || {}, { days: dz }); }
  try { window.__renderMenu((stX && stX.days) || {}, SIGNAL); } catch {}
  window.__renderTomorrow((stX && stX.days) || {}, SIGNAL, getStX).catch(() => {});
  window.__keepBanking();
  const seen = new Set(); const races = [];
  const add = (day, p) => { if (!p || !day || !p.k) return; const kk = day + '|' + p.k; if (seen.has(kk)) return; seen.add(kk); races.push({ ...p, day }); };
  Object.entries((jArch && jArch.state && jArch.state.days) || {}).forEach(([d, arr]) => (arr || []).forEach(p => add(d, p)));
  ((jA && jA.state && jA.state.prints) || []).forEach(p => add(p.day || ukd, p));
  races.sort((a, b) => a.day.localeCompare(b.day) || t2m(a.t) - t2m(b.t));
  const settled = races.filter(p => p.w && (p.picks || []).length);
  const picks = [];   // { day, t, c, h, d, w, wn }
  const isMarket = /\b(FAV2?|OR|TOPW|JPC)\b/.test(SIGNAL) || /^TM$/.test(SIGNAL) || /^FAV/.test(SIGNAL);
  if (!isMarket) {
    // PRINT family, whole archive
    settled.forEach(p => { const wn = hn(p.w); let pick = null;
      const top = p.picks.filter(x => x.pts != null).sort((a, b) => b.pts - a.pts);
      const tagPick = (t3) => p.picks.find(x => (x.tags || []).includes(t3));
      const m1 = SIGNAL.match(/^([A-ZΣ]+) #1$/);
      const tagParts = SIGNAL.split('+').map(s => s.trim().match(/^([A-ZΣ]+) #1$/)).filter(Boolean).map(m => m[1] + '1');
      if (m1) pick = tagPick(m1[1] + '1');
      else if (tagParts.length >= 2 && tagParts.length === SIGNAL.split('+').length) pick = p.picks.find(x => tagParts.every(t3 => (x.tags || []).includes(t3))) || null;
      else if (SIGNAL === 'PTS #1') pick = top.length >= 2 && top[0].pts > top[1].pts ? top[0] : null;
      else if (SIGNAL === 'PTS 20+') pick = top.length >= 2 && top[0].pts >= 20 ? top[0] : null;
      else if (SIGNAL === 'XS #1') { const xs = p.picks.filter(x => x.xs1 != null).sort((a, b) => b.xs1 - a.xs1); pick = xs.length >= 2 ? xs[0] : null; }
      else { const m2 = SIGNAL.match(/^PTS\+([A-Z]+)$/); if (m2 && top.length >= 2 && top[0].pts > top[1].pts && (top[0].tags || []).includes(m2[1] + '1')) pick = top[0]; }
      if (pick) picks.push({ day: p.day, t: p.t, c: p.course, h: pick.h, d: pick.d, w: hn(pick.h) === wn ? 1 : 0, wn: p.w }); });
  } else {
    // MARKET family, this month's days via results (sequential, paced)
    const JPCT = {}; Object.entries((jP && jP.jockeys) || {}).forEach(([jid, g]) => { if (g && g.runs >= 50) JPCT[jid] = g.wins / g.runs; });
    const claimOf = (r) => { const m = String(r.jockey || '').match(/\((\d+)\)/); return m ? Number(m[1]) : 0; };
    const SEL = {
      FAV: (rc) => rc.byD.length >= 2 ? rc.byD[0] : null, FAV2: (rc) => rc.byD.length >= 3 ? rc.byD[1] : null,
      TM: (rc) => { const a = rc.runners.filter(r => r.tm != null).sort((x, y) => y.tm - x.tm); return a.length >= 2 ? a[0] : null; },
      OR: (rc) => { const a = rc.runners.filter(r => r.ofr != null).sort((x, y) => y.ofr - x.ofr); return a.length >= 2 ? a[0] : null; },
      TOPW: (rc) => { const a = rc.runners.filter(r => r.lbs).sort((x, y) => y.lbs - x.lbs); return a.length >= 2 && a[0].lbs > a[1].lbs ? a[0] : null; },
      JPC: (rc) => { const a = rc.runners.filter(r => JPCT[r.jid] != null).sort((x, y) => JPCT[y.jid] - JPCT[x.jid]); return a.length >= 2 && JPCT[a[0].jid] > (JPCT[a[1].jid] || 0) ? a[0] : null; } };
    const parts = SIGNAL.split('+'); const missing = []; window.__missing = missing;
    const mDays = [...new Set(settled.map(p => p.day))].filter(d => d.startsWith(month)).sort();
    let i = 0;
    for (const d of mDays) {
      $('meta').textContent = `reading results · ${d} (${++i}/${mDays.length})`;
      let j = null; try { const r = await fetch('/api/priceday?date=' + d); j = await r.json(); } catch {}
      if (!(j && j.ok)) missing.push(d + (j && j.error ? ' ' + j.error : ''));
      if (!(j && j.ok) && j && /429/.test(String(j.error))) { await new Promise(r9 => setTimeout(r9, 2500)); try { const r = await fetch('/api/priceday?date=' + d); j = await r.json(); } catch {} }
      ((j && j.ok && j.races) || []).forEach(rc => { if (!rc.runners || rc.runners.length < 2) return;
        const wq = rc.runners.find(r => r.won); if (!wq) return;
        const topLbs = Math.max(...rc.runners.map(r => r.lbs || 0));
        rc.runners.forEach(r => { r.tm = topLbs && r.ofr != null && r.lbs ? r.ofr + (topLbs - r.lbs) + claimOf(r) : null; });
        rc.byD = rc.runners.filter(r => Number(r.d) > 1).sort((x, y) => x.d - y.d);
        const p1 = parts.map(k => SEL[k] ? SEL[k](rc) : null); if (p1.some(q => !q) || !p1.every(q => q === p1[0])) return;
        picks.push({ day: d, t: tK(rc.t), c: rc.course, h: p1[0].h, d: p1[0].d, w: p1[0] === wq ? 1 : 0, wn: wq.h }); });
      await new Promise(r9 => setTimeout(r9, 350));
    }
  }
  picks.sort((a, b) => a.day.localeCompare(b.day) || t2m(a.t) - t2m(b.t));
  const W = picks.filter(p => p.w).length, N = picks.length;
  const SQ = picks.map(p => p.w ? 'W' : 'L').join('');
  let cur = 0; for (let i = SQ.length - 1; i >= 0 && SQ[i] === 'L'; i--) cur++;
  let mx = 0, run = 0; for (const c of SQ) { if (c === 'L') { run++; mx = Math.max(mx, run); } else run = 0; }
  const dayN = new Set(picks.map(p => p.day)).size;
  $('rec').innerHTML = N ? `${W}/${N}<small>${Math.round(W / N * 100)}%</small>` : '—';
  const missNote = (window.__missing && window.__missing.length) ? `<br><span style="color:var(--red)">no results feed for ${window.__missing.length} day${window.__missing.length === 1 ? '' : 's'}: ${window.__missing.slice(0, 4).join(', ')}${window.__missing.length > 4 ? '\u2026' : ''}</span>` : '';
  const recon = '<br><span style="color:var(--am)">reconstructed from the archive after each race \u2014 not a pre-off bank</span>';
  $('meta').innerHTML = N ? `<b>${dayN}</b> days · ${isMarket ? 'SP' : 'print'} prices · longest losing run <b>${mx}</b> · current <b style="color:${cur ? 'var(--red)' : 'var(--lumo)'}">${cur}✗</b><br><span class="seq">${[...SQ].map(c => c === 'W' ? '<b style="color:var(--lumo)">W</b>' : '<span style="color:var(--red)">L</span>').join('')}</span>${missNote}${recon}` : ('no record found for ' + SIGNAL + ' in ' + monthName + missNote);
  const mPicks = picks.filter(p => p.day.startsWith(month));
  const mW = mPicks.filter(p => p.w).length;
  const byDay = {}; mPicks.forEach(p => (byDay[p.day] = byDay[p.day] || []).push(p));
  const blocks = Object.keys(byDay).sort().reverse().map(d => { const ps = byDay[d]; const w9 = ps.filter(p => p.w).length;
    return `<div class="day"><span>${d === ukd ? 'today' : d.slice(5)}</span><span>${w9}/${ps.length}</span></div>` +
      ps.map(p => `<div class="pk ${p.w ? 'w' : 'l'}"><div class="t">${p.t}<small>${abbr(p.c).slice(0, 10)}</small></div><div class="h">${p.h}${Number(p.d) > 0 ? `<small>@ ${p.d}</small>` : ''}${!p.w && p.wn ? `<span class="lost">won by ${p.wn}</span>` : ''}</div><div class="r">${p.w ? 'WON' : 'LOST'}</div></div>`).join(''); }).join('');
  $('list').innerHTML = mPicks.length ? `<div class="day" style="margin-top:4px;color:var(--lumo)"><span>${monthName}</span><span>${mW}/${mPicks.length} · ${Math.round(mW / mPicks.length * 100)}%</span></div>` + blocks : `<div class="empty">No ${SIGNAL} picks in ${monthName}.</div>`;
})();
</script>
</body>
</html>
