<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERMINAL 14 — RACESIDE</title>
<style>
:root{--bg:#070B12;--panel:#0D1420;--panel2:#111B2B;--line:#1C2940;--line2:#27395C;
--ink:#E8EEF7;--dim:#8A9BB5;--faint:#54657F;--cy:#00D1FF;--am:#FFB300;--grn:#00E676;--red:#FF3B5C;
--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--cond:-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--cond);padding:12px 10px 60px}
.wrap{max-width:760px;margin:0}
h1{font-size:24px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
background:linear-gradient(90deg,var(--cy),var(--grn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
.sub{font-size:11px;letter-spacing:.18em;color:var(--faint);font-weight:800;margin:4px 0 12px}
.sub a{color:var(--faint);text-decoration:none}
.upd{font-family:var(--mono);font-size:10.5px;color:var(--cy);margin:2px 0 10px}
.dash{display:flex;gap:7px;margin:0 0 7px;flex-wrap:wrap}
.dcell{flex:1;min-width:82px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
border-top:3px solid var(--cy);border-radius:6px;padding:9px 4px 8px;text-align:center}
.r2 .dcell{border-top-color:var(--am)}
.dcell.best{border-color:var(--grn);box-shadow:0 0 0 1px var(--grn)}
.dcell small{display:block;font-size:8px;letter-spacing:.1em;color:var(--dim);font-weight:800;text-transform:uppercase}
.dcell b{display:block;font-family:var(--mono);font-size:18px;font-weight:700;color:#fff;margin:3px 0 1px}
.dcell span{font-family:var(--mono);font-size:10px;color:var(--grn);font-weight:700}
.note{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin:6px 0 14px;line-height:1.7}
.note b{color:var(--am)}
.tile{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cy);border-radius:8px;padding:11px 12px;margin:0 0 10px}
.tile .hd2{font-size:11px;letter-spacing:.2em;font-weight:900;color:var(--cy);text-transform:uppercase;margin-bottom:7px}
.dayln{font-family:var(--mono);font-size:11.5px;line-height:2;color:var(--ink);border-bottom:1px solid var(--line)}
.dayln:last-child{border-bottom:0}
.dayln small{color:var(--faint)}
.dayln b{color:var(--am)}
.cln{font-family:var(--mono);font-size:11.5px;line-height:2;color:var(--ink)}
.cln small{color:var(--faint)}
.cln b{color:#fff}
.err{color:var(--red);font-family:var(--mono);font-size:11px}
#ldr{margin:0 0 12px}
#ldrBar{height:4px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
#ldrFill{height:100%;width:0%;background:linear-gradient(90deg,var(--cy),var(--grn));transition:width .25s ease}
#ldrTxt{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:5px}
#ldrTxt b{color:var(--grn)}
#ldr.done #ldrFill{width:100%}

</style>
</head>
<body>
<div class="wrap">
<h1>TERMINAL 14</h1>
<div class="sub">LAST 14 DAYS &middot; COMBO LEDGER &middot; <a href="/maxterminalx.html">&larr; TERMINAL X</a></div>
<div class="upd" id="upd">last 14 days</div>
<div id="ldr"><div id="ldrBar"><div id="ldrFill"></div></div><div id="ldrTxt">starting\u2026</div></div>
<div id="app"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const hn = (s) => String(s || '').toLowerCase().replace(/\s*\([a-z]{2,3}\)\s*$/i, '').trim();
const tK = (t) => { const m = String(t || '').trim().match(/(\d{1,2})[:.](\d{2})/); if (!m) return String(t || '').trim().split(' ')[0]; let hh = +m[1]; if (hh > 12) hh -= 12; return hh + ':' + m[2]; };
const ck0 = (c) => String(c || '').replace(/\s*\([^)]*\)/g, '').trim().toLowerCase();
const claimOf = (r) => { const m = String(r.jockey || '').match(/\((\d+)\)/); return m ? Number(m[1]) : 0; };

let JPCT = {};   // jid -> season strike %
const SEL = {
  FAV:  (rc) => { const a = rc.byD; return a.length >= 2 ? a[0] : null; },
  FAV2: (rc) => { const a = rc.byD; return a.length >= 3 ? a[1] : null; },
  TM:   (rc) => { const a = rc.runners.filter(r => r.tm != null).sort((x, y) => y.tm - x.tm); return a.length >= 2 ? a[0] : null; },
  OR:   (rc) => { const a = rc.runners.filter(r => r.ofr != null).sort((x, y) => y.ofr - x.ofr); return a.length >= 2 ? a[0] : null; },
  EDGE: (rc) => { const t = SEL.TM(rc); if (!t) return null;
    const mo = Math.max(...rc.runners.map(r => r.ofr || 0)); return mo > 0 && t.tm > mo ? t : null; },
  TOPW: (rc) => { const a = rc.runners.filter(r => r.lbs).sort((x, y) => y.lbs - x.lbs);
    return a.length >= 2 && a[0].lbs > a[1].lbs ? a[0] : null; },
  DRW:  (rc) => { const a = rc.runners.filter(r => r.dr).sort((x, y) => x.dr - y.dr); return a.length >= 3 ? a[0] : null; },
  JPC:  (rc) => { const a = rc.runners.filter(r => JPCT[r.jid] != null).sort((x, y) => JPCT[y.jid] - JPCT[x.jid]);
    return a.length >= 2 && JPCT[a[0].jid] > (JPCT[a[1].jid] || 0) ? a[0] : null; },
};
const COMBOS = (() => { const ks = Object.keys(SEL), out = [];
  const rec = (s, cur) => { if (cur.length) out.push([...cur]);
    for (let i = s; i < ks.length; i++) { cur.push(ks[i]); rec(i + 1, cur); cur.pop(); } };
  rec(0, []); return out; })();

const dayKey = (off) => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(off);
const dates14 = () => { const out = []; for (let i = 0; i < 14; i++) out.push(dayKey(new Date(Date.now() - i * 86400000))); return out; };

async function boot() {
  const ds = dates14();
  let tfDays = {};
  try { const r0 = await fetch('/api/yearstate?k=termfreeze:v1'); const j0 = await r0.json();
    tfDays = (j0 && j0.state && j0.state.days) || {}; } catch {}
  try { const rp = await fetch('/api/peopleall?v=2'); const jp = await rp.json();
    Object.entries((jp && jp.jockeys) || {}).forEach(([jid, g]) => {
      if (g && g.runs >= 50) JPCT[jid] = Math.round(g.wins / g.runs * 1000) / 10; }); } catch {}
  let doneDays = 0;
  const tick = (d, nRaces) => { doneDays++;
    const f = document.getElementById('ldrFill'), t = document.getElementById('ldrTxt');
    if (f) f.style.width = Math.round(doneDays / ds.length * 100) + '%';
    if (t) t.textContent = `loading ${doneDays}/${ds.length} days\u2026 ${d} ${nRaces == null ? '(no data)' : '(' + nRaces + ' races)'}`; };
  const oneDay = async (d) => {
    const r = await fetch('/api/priceday?date=' + d);
    const j = await r.json().catch(() => null);
    return { j, status: r.status };
  };
  const got = [];
  for (const d of ds) {
    try {
      let { j, status } = await oneDay(d);
      if (!(j && j.ok) && ((j && /429/.test(String(j.error))) || status === 429)) {
        const t = document.getElementById('ldrTxt'); if (t) t.textContent = `rate limited \u2014 retrying ${d}\u2026`;
        await new Promise(r9 => setTimeout(r9, 2500));
        ({ j, status } = await oneDay(d));
      }
      let snap = null;
      try { const r2 = await fetch('/api/yearstate?k=minussnap:' + d); const j2 = await r2.json();
        snap = (j2 && j2.state && j2.state.races) || null; } catch {}
      const err = j && j.ok ? null : (j && j.error) || ('http-' + status);
      const out = j && j.ok ? { d, races: j.races || [], snap, err: null } : { d, races: null, snap, err };
      tick(d, out.races ? out.races.length : null); got.push(out);
    } catch (e9) { tick(d, null); got.push({ d, races: null, snap: null, err: String(e9).slice(0, 40) }); }
    await new Promise(r9 => setTimeout(r9, 350));
  }
  { const t = document.getElementById('ldrTxt'); if (t) t.textContent = 'scoring\u2026'; }
  await new Promise(r9 => setTimeout(r9, 30));
  const agg = {}; COMBOS.forEach(cb => { agg[cb.join('+')] = { n: 0, w: 0 }; });
  const dayRows = [];
  let totRaces = 0, missing = 0, frozenRaces = 0;
  got.forEach(({ d, races, snap, err }) => {
    if (!races) { missing++; dayRows.push({ d, txt: `<span class="err">no data \u00b7 ${err || '?'}</span>` }); return; }
    let dayN = 0; const dayHit = {};
    races.forEach(rc => {
      if (!rc.runners || rc.runners.length < 2) return;
      const w = rc.runners.find(r => r.won); if (!w) return;
      const topLbs = Math.max(...rc.runners.map(r => r.lbs || 0));
      rc.runners.forEach(r => { r.tm = topLbs && r.ofr != null && r.lbs ? r.ofr + (topLbs - r.lbs) + claimOf(r) : null; });
      const k1 = tK(rc.t) + '|' + ck0(rc.course);
      const pf = tfDays[d] && tfDays[d][k1] && tfDays[d][k1].prices;
      let fz = pf || null;
      if (!fz && snap) { const sr = snap[k1] || snap[String(rc.t).split(' ')[0] + '|' + String(rc.course || '').replace(/\s*\(aw\)\s*/i, '').trim().toLowerCase()];
        if (sr && sr.rides) { fz = {}; sr.rides.forEach(r2 => { if (Number(r2.d) > 0) fz[hn(r2.h)] = Number(r2.d); }); } }
      let used = false;
      if (fz) rc.runners.forEach(r => { const v = fz[hn(r.h)]; if (v > 1) { r.d = v; used = true; } });
      if (used) frozenRaces++;
      rc.byD = rc.runners.filter(r => Number(r.d) > 1).sort((x, y) => x.d - y.d);
      dayN++; totRaces++;
      const pick1 = {}; Object.keys(SEL).forEach(k => { pick1[k] = SEL[k](rc); });
      COMBOS.forEach(cb => {
        const p0 = pick1[cb[0]]; if (!p0) return;
        for (let i9 = 1; i9 < cb.length; i9++) if (pick1[cb[i9]] !== p0) return;
        const key = cb.join('+'); agg[key].n++;
        const g = dayHit[key] = dayHit[key] || { n: 0, w: 0 }; g.n++;
        if (p0 === w) { agg[key].w++; g.w++; }
      });
    });
    const f = dayHit['FAV'] || { n: 0, w: 0 }, t = dayHit['TM'] || { n: 0, w: 0 }, ft = dayHit['FAV+TM'] || { n: 0, w: 0 };
    dayRows.push({ d, txt: `${dayN} races <small>\u00b7</small> FAV <b>${f.w}/${f.n}</b> <small>\u00b7</small> TM <b>${t.w}/${t.n}</b> <small>\u00b7</small> FAV+TM <b>${ft.w}/${ft.n}</b>` });
  });
  const rows = Object.entries(agg).map(([nm, g]) => ({ nm, ...g, pc: g.n ? Math.round(g.w / g.n * 100) : 0 }));
  const solos = rows.filter(r => !r.nm.includes('+'));
  const multis = rows.filter(r => r.nm.includes('+') && r.n >= 2).sort((a, b) => b.pc - a.pc || b.w - a.w);
  const bestNm = (multis.filter(r => r.n >= 20)[0] || multis[0] || {}).nm;
  const cell = (g) => `<div class="dcell${g.nm === bestNm ? ' best' : ''}"><small>${g.nm}</small><b>${g.w}/${g.n}</b><span>${g.pc}%</span></div>`;
  $('app').innerHTML =
    `<div class="dash">${solos.map(cell).join('')}</div>` +
    `<div class="dash r2">${multis.slice(0, 12).map(cell).join('')}</div>` +
    `<div class="note">Agreement picks over <b>${totRaces}</b> races, ${14 - missing} of 14 days${missing ? ` <span class="err">(${missing} missing)</span>` : ''} \u00b7 <b>${frozenRaces}</b> at frozen pre-off prices, rest SP \u00b7 ${COMBOS.length} combinations scanned (solos to 8-stacks).
     FAV/FAV2 market \u00b7 TM rating+claims \u00b7 OR top mark \u00b7 EDGE thrown in \u00b7 TOPW top weight \u00b7 DRW lowest stall \u00b7 JPC best jockey strike.
     \u03a3 / STEAM / POWER join as the freeze era accrues days.</div>` +
    (multis.length > 12 ? `<div class="tile"><div class="hd2">All pairs &amp; triples</div>${
      multis.slice(12).map(r => `<div class="cln"><b>${r.nm}</b> \u2014 ${r.w}/${r.n} <small>(${r.pc}%)</small></div>`).join('')}</div>` : '') +
    `<div class="tile"><div class="hd2">Day by day</div>${dayRows.map(r => `<div class="dayln"><small>${r.d}</small> \u2014 ${r.txt}</div>`).join('')}</div>`;
  document.getElementById('ldr').classList.add('done');
  document.getElementById('ldrTxt').innerHTML = `<b>complete</b> \u00b7 ${14 - missing}/14 days \u00b7 ${totRaces} races scored`;
  $('upd').textContent = 'last 14 days \u00b7 built ' + new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' }).format(new Date());
}
boot().catch(e => { $('upd').innerHTML = '<span class="err">failed: ' + e + '</span>'; });
</script>
</body>
</html>
