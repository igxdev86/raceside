<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCHIVE — RACESIDE</title>
<style>
  :root{--bg:#101418;--tile:#171D23;--line:rgba(255,255,255,.09);--ink:#EDF1F5;--dim:#93A1AE;--faint:#5C6B77;--gold:#E8B54C;--red:#E36565;--green:#5FBF77;--blue:#6FA8FF;--pink:#ff8fc7;--mono:'SF Mono',ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,system-ui,sans-serif;padding:14px 12px 80px}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:19px;margin:14px 0 2px}
  .sub{color:var(--dim);font-size:12px}
  .tile{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:10px 0}
  .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .hd b{font-size:14px;color:#FFFFFF}
  .pick{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
  .pick:last-child{border-bottom:0}
  .pts{font-family:var(--mono);background:#F6E7B8;color:#101418;border-radius:6px;padding:0 6px;font-weight:700;font-size:12px}
  .pts.big{background:var(--gold)}
  .tags{display:block;color:var(--faint);font-size:10px;font-family:var(--mono);margin-top:1px}
  .res{font-size:12px;font-family:var(--mono)}
  .chip{display:inline-block;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-right:6px;margin-bottom:6px;color:var(--dim)}
  .dayhd{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#FFFFFF;margin:22px 0 2px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .dayhd small{color:var(--faint);letter-spacing:0}
  .jump{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .jump a{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 9px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>PRINT ARCHIVE</h1>
  <div class="sub">every print ever held — the whole record, day by day, newest first.</div>
  <div id="app"><div style="padding:30px;text-align:center;color:var(--dim)">loading archive…</div></div>
  <div class="sub" style="text-align:center;margin-top:26px">a <a href="/" style="color:var(--dim)">RACESIDE</a> record · a design, not a finding · not advice</div>
</div>
<script src="/nav.js?v=6" defer></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const hn = (s) => String(s || '').toLowerCase().replace(/\s*\([a-z]{2,3}\)\s*$/i, '').trim();
  const t2m = (t) => { const m = String(t).match(/(\d{1,2})[:.](\d{2})/); if (!m) return 0; let hh = +m[1]; if (hh < 10) hh += 12; return hh * 60 + +m[2]; };
  const ukd = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date());
  let st = null, arch = null;
  try { const j = await (await fetch('/api/yearstate?k=alertstate:v1')).json(); st = j && j.state ? j.state : null; } catch {}
  try { const j = await (await fetch('/api/yearstate?k=printsarchive:v1')).json(); arch = j && j.state && j.state.days ? j.state.days : null; } catch {}

  const byDay = {};
  const put = (day, p) => { const arr = (byDay[day] = byDay[day] || []); if (!arr.some(q => q.k === p.k)) arr.push(p); };
  if (arch) Object.entries(arch).forEach(([d2, arr]) => (arr || []).forEach(p => put(d2, p)));
  if (st && st.prints) st.prints.forEach(p => put(p.day || ukd, p));

  const days = Object.keys(byDay).sort().reverse();
  if (!days.length) { $('app').innerHTML = '<div style="padding:30px;text-align:center;color:var(--dim)">nothing archived yet — the first day locks in at tonight\u2019s rollover.</div>'; return; }

  let totN = 0, totRes = 0, totHits = 0;
  days.forEach(d2 => byDay[d2].forEach(p => { totN++; if (p.w) totRes++; if (p.hit) totHits++; }));
  const strike = totRes ? Math.round(totHits / totRes * 100) : null;
  const chips = `<div style="margin:10px 0 2px"><span class="chip">${days.length} day${days.length === 1 ? '' : 's'}</span><span class="chip">${totN} prints</span><span class="chip">${totRes} resulted</span><span class="chip" style="color:${totHits ? 'var(--green)' : 'var(--dim)'}">${totHits} hits</span>${strike != null ? `<span class="chip" style="color:var(--green)">${strike}% strike</span>` : ''}</div>`;

  const jump = `<div class="jump">${days.map(d2 => `<a href="#d-${d2}">${d2.slice(5)}</a>`).join('')}</div>`;

  const tile = (p) => `<div class="tile"><div class="hd"><b>${p.t || ''} ${String(p.course || '').toUpperCase()}${p.quiet ? ' <small style="color:var(--faint);font-size:9px;font-family:var(--mono)">quiet</small>' : ''}</b><span class="res" style="color:${p.hit ? 'var(--green)' : p.w ? 'var(--red)' : 'var(--faint)'}">${p.w ? (p.hit ? '\u2705 ' : '\u274c ') + p.w : 'unresulted'}</span></div>${(p.picks || []).map(x => `<div class="pick"><span><span class="pts${x.pts >= 15 ? ' big' : ''}">${x.pts}</span> <b>${x.h}</b>${p.w && hn(x.h) === hn(p.w) ? ' \u2705' : ''}${(x.tags || []).length ? `<span class="tags">${x.tags.slice(0, 5).join(' \u00b7 ')}</span>` : ''}</span><span style="font-family:var(--mono);font-size:12px;color:#FFFFFF">@ ${x.d}${x.xs1 != null ? ` <small style="color:${x.xs1 >= 15 ? 'var(--gold)' : 'var(--faint)'}">xs ${x.xs1}</small>` : ''}</span></div>`).join('')}</div>`;

  const body = days.map(d2 => { const arr = byDay[d2].slice().sort((a, b2) => t2m(a.t) - t2m(b2.t));
    const res = arr.filter(p => p.w).length, hits = arr.filter(p => p.hit).length;
    const pc = res ? Math.round(hits / res * 100) + '%' : '\u2014';
    return `<div class="dayhd" id="d-${d2}"><span>${d2}${d2 === ukd ? ' \u00b7 TODAY' : ''}</span><small>${arr.length} prints \u00b7 ${res} resulted \u00b7 ${hits} hits \u00b7 ${pc}</small></div>${arr.map(tile).join('')}`; }).join('');

  $('app').innerHTML = chips + jump + body;
})();
</script>
</body>
</html>
