<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCHIVE — RACESIDE</title>
<style>
  :root{--bg:#101418;--tile:#23282E;--line:rgba(255,255,255,.09);--ink:#EDF1F5;--dim:#93A1AE;--faint:#5C6B77;--gold:#E8B54C;--red:#E36565;--green:#5FBF77;--blue:#6FA8FF;--mono:'SF Mono',ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,system-ui,sans-serif;padding:14px 12px 80px}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:19px;margin:14px 0 2px}
  .sub{color:var(--dim);font-size:12px}
  .tile{background:var(--tile) !important;color-scheme:dark;border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:11px 14px;margin:10px 0}
  .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
  .hd b{font-size:15px;color:#FFFFFF}
  .pick{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .pick:last-child{border-bottom:0}
  .pick .nm{color:#FFFFFF;font-weight:700;font-size:14.5px}
  .pick .left{min-width:0;flex:1}
  .pick .right{white-space:nowrap;color:#FFFFFF;font-family:var(--mono);font-size:12.5px;text-align:right}
  .star{color:var(--gold);font-family:var(--mono);font-weight:800;font-size:13px}
  .tags{display:block;color:var(--faint);font-family:var(--mono);font-size:10px;margin-top:1px}
  .sig{display:inline-block;background:rgba(255,105,180,.16);color:#ff8fc7;font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;margin-top:3px}
  .res{font-size:12px;font-family:var(--mono)}
  .chip{display:inline-block;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-right:6px;margin-bottom:6px;color:var(--dim)}
  .dayhd{scroll-margin-top:52px;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#FFFFFF;margin:22px 0 2px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .dayhd small{color:var(--faint);letter-spacing:0}
  .jump{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .jump a{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 9px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>PRINT ARCHIVE</h1>
  <div class="sub">every print ever held — day by day, newest first, with each tag&rsquo;s win rate and the pink &Sigma; from the whole record.</div>
  <div id="app"><div style="padding:30px;text-align:center;color:var(--dim)">loading archive…</div></div>
  <div class="sub" style="text-align:center;margin-top:26px">a <a href="/" style="color:var(--dim)">RACESIDE</a> record · a design, not a finding · not advice</div>
</div>
<script src="/nav.js?v=6" defer></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const hn = (s) => String(s || '').toLowerCase().replace(/\s*\([a-z]{2,3}\)\s*$/i, '').trim();
  const t2m = (t) => { const m = String(t).match(/(\d{1,2})[:.](\d{2})/); if (!m) return 0; let hh = +m[1]; if (hh < 10) hh += 12; return hh * 60 + +m[2]; };
  const ukd = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date());
  let st = null, arch = null;
  try { const j = await (await fetch('/api/yearstate?k=alertstate:v1')).json(); st = j && j.state ? j.state : null; } catch {}
  try { const j = await (await fetch('/api/yearstate?k=printsarchive:v1')).json(); arch = j && j.state && j.state.days ? j.state.days : null; } catch {}

  const byDay = {};
  const put = (day, p) => { const arr = (byDay[day] = byDay[day] || []); if (!arr.some(q => q.k === p.k)) arr.push(p); };
  if (arch) Object.entries(arch).forEach(([d2, arr]) => (arr || []).forEach(p => put(d2, p)));
  if (st && st.prints) st.prints.forEach(p => put(p.day || ukd, p));

  const days = Object.keys(byDay).sort().reverse();
  // finishing places: use stored pos; backfill missing days from priceday (newest 14)
  const rkz = (t, c) => String(t || '').trim().split(' ')[0] + '|' + String(c || '').replace(/\s*\([^)]*\)/g, '').toLowerCase().replace(/[^a-z]/g, '');
  const posDay = {};
  const need = days.filter(d2 => byDay[d2].some(p => p.w && (p.picks || []).some(x => x.pos == null))).slice(0, 14);
  await Promise.all(need.map(async (d2) => { try {
    const pdj = await (await fetch('/api/priceday?v=5&date=' + d2)).json();
    const m = {}; ((pdj && pdj.races) || []).forEach(r2 => { const pm = {}; (r2.runners || []).forEach(q => { if (q.pos) pm[hn(q.h)] = String(q.pos); }); m[rkz(r2.t, r2.course)] = pm; });
    posDay[d2] = m; } catch {} }));
  const posOf = (d2, p, x) => x.pos != null ? String(x.pos) : (((posDay[d2] || {})[p.k] || {})[hn(x.h)] || null);
  const ordTxt = (v) => { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n + (({1:'st',2:'nd',3:'rd'})[n] || 'th') : String(v); };
  if (!days.length) { $('app').innerHTML = '<div style="padding:30px;text-align:center;color:var(--dim)">nothing archived yet — the first day locks in at tonight\u2019s rollover.</div>'; return; }

  // tag win rates + pink sigma, from the whole record (same maths as PRINT LIST)
  const tagWin = {}; let sigN = 0, sigW = 0;
  days.forEach(d2 => byDay[d2].forEach(p => { if (!p.w || !(p.picks || []).length) return;
    p.picks.forEach(x => { const won = hn(x.h) === hn(p.w); sigN++; if (won) sigW++;
      (x.tags || []).forEach(t2 => { const g = (tagWin[t2] = tagWin[t2] || { n: 0, w: 0 }); g.n++; if (won) g.w++; }); }); }));
  const sigBase = sigN ? sigW / sigN * 100 : null;
  const fmtTag = (t2) => { const g = tagWin[t2];
    if (!g || g.n < 5 || sigBase == null) return t2;
    const pc = g.w / g.n * 100;
    return `${t2} <b style="color:${pc >= sigBase ? 'var(--green)' : 'var(--faint)'}">${pc.toFixed(0)}%</b>`; };
  const sumTags = (tags2) => { let s = 0, any = false;
    (tags2 || []).forEach(t2 => { const g = tagWin[t2]; if (g && g.n >= 5) { s += g.w / g.n * 100; any = true; } });
    return any ? Math.round(s) : null; };

  let totN = 0, totRes = 0, totHits = 0;
  days.forEach(d2 => byDay[d2].forEach(p => { totN++; if (p.w) totRes++; if (p.hit) totHits++; }));
  const strike = totRes ? Math.round(totHits / totRes * 100) : null;
  const chips = `<div style="margin:10px 0 2px"><span class="chip">${days.length} day${days.length === 1 ? '' : 's'}</span><span class="chip">${totN} prints</span><span class="chip">${totRes} resulted</span><span class="chip" style="color:${totHits ? 'var(--green)' : 'var(--dim)'}">${totHits} hits</span>${strike != null ? `<span class="chip" style="color:var(--green)">${strike}% strike</span>` : ''}</div>`;

  const jump = `<div class="jump">${days.map(d2 => `<a href="#d-${d2}">${d2.slice(5)}</a>`).join('')}</div>`;

  const tile = (p, d2) => `<div class="tile"><div class="hd"><b>${p.t || ''} ${String(p.course || '').toUpperCase()}${p.quiet ? ' <small style="color:var(--faint);font-size:9px;font-family:var(--mono)">quiet</small>' : ''}</b><span class="res" style="color:${p.hit ? 'var(--green)' : p.w ? 'var(--red)' : 'var(--faint)'}">${p.w ? (p.hit ? '\u2705 ' : '\u274c ') + p.w : 'unresulted'}</span></div>${(p.picks || []).map(x => { const s2 = sumTags(x.tags); const pv = p.w ? posOf(d2, p, x) : null;
    return `<div class="pick"><span class="left"><span class="star">\u2605 ${x.pts}</span> <span class="nm">${x.h}</span>${p.w && hn(x.h) === hn(p.w) ? ' \u2705' : ''}${pv ? ` <b style="color:${pv === '1' ? 'var(--green)' : ['2','3'].includes(pv) ? 'var(--gold)' : 'var(--faint)'};font-family:var(--mono);font-size:11px">${ordTxt(pv)}</b>` : p.w ? ' <b style="color:var(--faint);font-family:var(--mono);font-size:11px">\u2014</b>' : ''}${(x.tags || []).length ? `<span class="tags">${x.tags.slice(0, 5).map(fmtTag).join(' \u00b7 ')}</span>` : ''}${s2 != null ? `<span class="sig">\u03a3 ${s2}%</span>` : ''}</span><span class="right">@ ${x.d}${x.xs1 != null ? `<br><span style="font-size:10.5px;${x.xs1 >= 15 ? 'color:var(--gold);font-weight:700' : 'color:var(--dim)'}">XS1 ${x.xs1}</span>` : ''}</span></div>`; }).join('')}</div>`;

  const body = days.map(d2 => { const arr = byDay[d2].slice().sort((a, b2) => t2m(a.t) - t2m(b2.t));
    const res = arr.filter(p => p.w).length, hits = arr.filter(p => p.hit).length;
    const pc = res ? Math.round(hits / res * 100) + '%' : '\u2014';
    return `<div class="dayhd" id="d-${d2}"><span>${d2}${d2 === ukd ? ' \u00b7 TODAY' : ''}</span><small>${arr.length} prints \u00b7 ${res} resulted \u00b7 ${hits} hits \u00b7 ${pc}</small></div>${arr.map(p => tile(p, d2)).join('')}`; }).join('');

  $('app').innerHTML = chips + jump + body;
  document.querySelector('.jump').addEventListener('click', (ev) => {
    const a = ev.target.closest('a'); if (!a) return;
    ev.preventDefault();
    const el = document.getElementById(a.getAttribute('href').slice(1));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
})();
</script>
</body>
</html>
