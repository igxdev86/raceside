<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAX PRINTS + — RACESIDE</title>
<style>
  :root{--bg:#101418;--tile:#23282E;--line:rgba(255,255,255,.09);--ink:#EDF1F5;--dim:#93A1AE;--faint:#5C6B77;--gold:#E8B54C;--red:#E36565;--green:#5FBF77;--blue:#6FA8FF;--mono:'SF Mono',ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,system-ui,sans-serif;padding:14px 12px 80px}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:19px;margin:14px 0 2px}
  .sub{color:var(--dim);font-size:12px}
  .tile{background:var(--tile) !important;color-scheme:dark;border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:11px 14px;margin:10px 0}
  .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
  .hd b{font-size:15px;color:#FFFFFF}
  .pick{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .pick:last-child{border-bottom:0}
  .pick .nm{color:#FFFFFF;font-weight:700;font-size:14.5px}
  .pick.np .nm{color:var(--dim);font-weight:600}
  .pick .left{min-width:0;flex:1}
  .pick .right{white-space:nowrap;color:#FFFFFF;font-family:var(--mono);font-size:12.5px;text-align:right}
  .star{color:var(--gold);font-family:var(--mono);font-weight:800;font-size:13px}
  .pick.np .star{color:var(--faint)}
  .num{display:inline-block;background:rgba(255,255,255,.10);color:#FFFFFF;font-family:var(--mono);font-size:11px;border-radius:6px;padding:0 5px;margin-right:2px}
  .tsort{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 2px}
  .tsort button{font-family:var(--mono);font-size:9px;letter-spacing:.05em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--faint)}
  .tsort button.on{border-color:var(--gold);color:var(--gold)}
  .tags{display:block;color:var(--faint);font-family:var(--mono);font-size:10px;margin-top:1px}
  .mx{display:inline-block;background:rgba(62,230,177,.16);color:#FFFFFF;font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;margin-top:3px;margin-left:4px;border:1px solid rgba(62,230,177,.35)}
  .lum{display:inline-block;background:rgba(234,255,0,.14);color:#EAFF00;font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;margin-top:3px;margin-left:4px}
  .sig{display:inline-block;background:rgba(255,105,180,.16);color:#ff8fc7;font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;margin-top:3px}
  .res{font-size:12px;font-family:var(--mono)}
  .chip{display:inline-block;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-right:6px;margin-bottom:6px;color:var(--dim)}
  .dayhd{scroll-margin-top:52px;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#FFFFFF;margin:22px 0 2px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .dayhd small{color:var(--faint);letter-spacing:0}
  .jump{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .jump a{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 9px;text-decoration:none}
  .jump a{position:relative}
  .jump a .ndot{position:absolute;top:-2px;right:-1px;width:7px;height:7px;border-radius:99px;background:#22C55E;border:1.5px solid var(--bg)}
  .rrow{background:var(--tile);border:1px solid var(--line);border-radius:11px;padding:8px 11px;margin:0 0 9px;scroll-margin-top:52px}
  .rrow .rhd{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink);margin-bottom:4px}
  .sl{display:flex;align-items:baseline;gap:7px;font-family:var(--mono);font-size:10px;color:var(--dim);padding:3.5px 2px;border-bottom:1px solid var(--line)}
  .sl:last-child{border-bottom:0}
  .sl .lb{flex:none;width:52px;font-size:8.5px;letter-spacing:.06em;color:var(--faint)}
  .sl .nm3{flex:none;font-weight:700;font-size:10.5px;color:var(--ink);max-width:34%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sl .ds{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sl.lmatch{background:#FFF9E3;box-shadow:inset 2px 0 0 #E4C65A;border-radius:4px}
  .seqtile{background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:7px 11px;margin:0 0 7px;font-family:var(--mono);font-size:10px;color:var(--dim)}
  .seqtile > b{display:block;font-size:10.5px;color:var(--ink);margin-bottom:3px;letter-spacing:.04em}
  .seqline{display:inline-block;margin-right:11px;line-height:1.9}
  .seqline b{color:var(--ink)}
  .seq{font-family:var(--mono);font-size:9px;color:var(--dim);border-left:2px solid #C1121F;padding:2px 0 2px 7px;margin:1px 0 4px;line-height:1.5}
  .seq b{color:var(--ink)}
  .btile .bk{display:block;margin:0 0 6px;padding:5px 9px}
  .btile .blb{display:block;margin:0 0 7px}
  .bask{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);line-height:2}
  .fsort{display:flex;gap:5px;margin:6px 0 8px;flex-wrap:wrap}
  .fsb{font-family:var(--mono);font-weight:800;font-size:9.5px;background:#fff;border:1.5px solid var(--line);border-radius:7px;color:var(--dim);padding:4px 8px}
  .fsb.on{border-color:var(--red);color:var(--red)}
  .fcard{margin-top:8px;padding-top:6px;border-top:2px solid var(--ink)}
  .frow{padding:7px 0;border-bottom:1px solid var(--line)}
  .frow.fwin{background:#E9F7EE;margin:0 -6px;padding:7px 6px;border-radius:6px}
  .frm{font-family:var(--mono);font-size:9.5px;color:var(--faint);font-weight:400;margin-right:2px}
  .fl1{font-size:14.5px;font-weight:800;color:var(--ink)}
  .fnum{display:inline-block;min-width:20px;color:var(--red)}
  .fl2{font-family:var(--mono);font-size:11px;color:var(--ink);margin-top:2px}
  .fl3{font-size:10.5px;color:var(--dim);margin-top:2px}
  .fl3 b{color:var(--ink)}
  .pcard{margin:6px 0 4px;padding:6px 0 4px;border-top:1px dashed var(--line)}
  .prow{font-size:12.5px;line-height:1.9;color:var(--ink)}
  .pstar{font-family:var(--mono);font-size:10px;color:var(--red);font-weight:800}
  .ptags{font-family:var(--mono);font-size:9px;color:var(--dim);margin-left:7px}
  .pjt{font-family:var(--mono);font-size:9px;color:var(--faint)}
  .upd{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--faint);margin:0 0 6px}
  .pstrip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
  .pchip{flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:800;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:6px 9px;color:var(--ink)}
  .pchip small{display:block;font-size:8px;color:var(--faint);letter-spacing:.06em}
  .pchip.on{border-color:var(--red);color:var(--red)}
  .pchip.gn{opacity:.55}
  .gt{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:800;color:#1B7A3D;margin:0 5px 4px 2px}
  .blb{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--faint);margin-right:7px}
  .bk{display:inline-block;font-family:var(--mono);font-size:9.5px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:1px 7px;margin:0 5px 4px 0}
  .bk b{color:var(--ink)}
  .bk .cdmk{color:#8a6d00;background:rgba(228,198,90,.35);border-radius:4px;padding:0 3px;font-size:8px;letter-spacing:.04em}
  .bk.bkwin{background:#E4F5EA;border-color:#1B7A3D;color:var(--ink);box-shadow:0 0 0 1px #1B7A3D}
  .sl.lwin{background:#E4F5EA;box-shadow:inset 2px 0 0 #1B7A3D;border-radius:4px}
  .rrow.rwin{border-color:#1B7A3D;box-shadow:0 0 0 1px rgba(27,122,61,.35)}
</style>
</head>
<body>
<div class="wrap">
  <h1>MAX PRINTS <span style="color:var(--red)">+</span></h1>
  <div class="sub">one line per race from today&rsquo;s still-to-run cards, same engine and data as MAX PRINTS. LOW MX = each race&rsquo;s lowest &Sigma;&times;odds runner.</div>
  <div id="app"><div style="padding:30px;text-align:center;color:var(--dim)">loading max lists…</div></div>
  <div class="sub" style="text-align:center;margin-top:26px">a <a href="/" style="color:var(--dim)">RACESIDE</a> record · a design, not a finding · not advice</div>
</div>
<script src="/nav.js?v=15" defer></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const hn = (s) => String(s || '').toLowerCase().replace(/\s*\([a-z]{2,3}\)\s*$/i, '').trim();
  const t2m = (t) => { const m = String(t).match(/(\d{1,2})[:.](\d{2})/); if (!m) return 0; let hh = +m[1]; if (hh < 10) hh += 12; return hh * 60 + +m[2]; };
  const tK = (t) => { const m = String(t || '').trim().match(/(\d{1,2})[:.](\d{2})/); if (!m) return String(t || '').trim().split(' ')[0]; let hh = +m[1]; if (hh > 12) hh -= 12; return hh + ':' + m[2]; };
  const rkz = (t, c) => tK(t) + '|' + String(c || '').replace(/\s*\([^)]*\)/g, '').toLowerCase().replace(/[^a-z]/g, '');
  const ukd = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date());
  let st = null, arch = null, people = null, up = null, seqPre = null;
  const gj = (u) => fetch(u).then(r => r.json()).catch(() => null);
  {   // one parallel round-trip for every store this page needs
    const [j1, j2, j3, j4, j5] = await Promise.all([
      gj('/api/yearstate?k=alertstate:v1'), gj('/api/yearstate?k=printsarchive:v1'),
      gj('/api/peopleall?v=2'), gj('/api/upcoming'), gj('/api/yearstate?k=courseseq:v1') ]);
    st = j1 && j1.state ? j1.state : null;
    arch = j2 && j2.state && j2.state.days ? j2.state.days : null;
    people = j3;
    up = j4;
    seqPre = j5;
  }
  if (!(people && people.ok)) { $('app').innerHTML = '<div class="tile">people tables unavailable — cannot score</div>'; return; }
  // today's still-to-run races from the live feed; the cut-off is the off time
  const lonNow = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
  const nowMin = (+lonNow.slice(0, 2)) * 60 + (+lonNow.slice(3, 5));
  const races = {};
  if (up && up.ok) (up.rides || []).filter(r => r.day === 'today').forEach(r => {
    const k = rkz(r.t, r.course);
    (races[k] = races[k] || { k, t: tK(r.t), course: r.course, rclass: r.rclass || '', dist: r.dist || '', going: r.going || '', rtype: r.rtype || '', rs: [] }).rs.push({ h: r.h, num: r.num || null, hid: r.hid || null, form: r.form || '', jockey: r.jockey, trainer: r.trainer || '', jid: r.jid, tid: r.tid, ofr: r.ofr, lbs: r.lbs, d: Number(r.d) > 1 ? Number(r.d) : null, pos: null });
  });
  const list = Object.values(races).filter(rc => rc.rs.length >= 3).sort((a, b2) => t2m(a.t) - t2m(b2.t));
  list.forEach(rc => { rc.gone = t2m(rc.t) <= nowMin; });
  if (!list.length) { $('app').innerHTML = '<div style="padding:30px;text-align:center;color:var(--dim)">no races left to run today.</div>'; return; }
  const byDay = { [ukd]: list.map(rc => ({ k: rc.k, t: rc.t, course: rc.course, rclass: rc.rclass, dist: rc.dist, going: rc.going, rtype: rc.rtype, gone: rc.gone, picks: [], _rs: rc.rs })) };
  const days = [ukd];

  // ---- history: tag + XS1-rank win rates from stored prints ----
  const ptsBand = (v) => v >= 15 ? '15+' : v >= 9 ? '9-14' : v >= 5 ? '5-8' : '0-4';
  const tagWin = {}; const xrWin = {}; const ptsWin = {}; let sigN = 0, sigW = 0;
  const histPrints = []; const seenH = new Set();
  const addH = (day2, p) => { const kk = (day2 || '') + '|' + p.k; if (seenH.has(kk)) return; seenH.add(kk); histPrints.push(p); };
  if (arch) Object.entries(arch).forEach(([d2, arr]) => (arr || []).forEach(p => addH(d2, p)));
  if (st && st.prints) st.prints.forEach(p => addH(p.day || ukd, p));
  [histPrints].forEach(hp => hp.forEach(p => { if (!p.w || !(p.picks || []).length) return;
    p.picks.forEach(x => { const won = hn(x.h) === hn(p.w); sigN++; if (won) sigW++;
      (x.tags || []).forEach(t3 => { const g = (tagWin[t3] = tagWin[t3] || { n: 0, w: 0 }); g.n++; if (won) g.w++; }); { const b2 = ptsBand(x.pts); const g2 = (ptsWin[b2] = ptsWin[b2] || { n: 0, w: 0 }); g2.n++; if (won) g2.w++; } });
    const ranked = p.picks.filter(x => x.xs1 != null).sort((a2, b2) => b2.xs1 - a2.xs1);
    ranked.forEach((x, i) => { const g = (xrWin[i + 1] = xrWin[i + 1] || { n: 0, w: 0 }); g.n++; if (hn(x.h) === hn(p.w)) g.w++; }); }));
  const sigBase = sigN ? sigW / sigN * 100 : null;
  const fmtTag = (t3) => { const g = tagWin[t3]; if (!g || g.n < 5 || sigBase == null) return t3 === 'OR1' ? `<b style=\"color:var(--ink)\">OR1</b>` : t3;
    const pc = g.w / g.n * 100;
    return `${t3 === 'OR1' ? '<b style="color:var(--ink)">OR1</b>' : t3} <b style="color:${pc >= sigBase ? 'var(--green)' : 'var(--faint)'}">${pc.toFixed(0)}%</b>`; };
  const xrPct = (r) => { const g = xrWin[r]; return g && g.n >= 5 ? g.w / g.n * 100 : null; };
  const sumTags = (tags2, xr2, pts2) => { let s = 0, any = false;
    (tags2 || []).forEach(t3 => { const g = tagWin[t3]; if (g && g.n >= 5) { s += g.w / g.n * 100; any = true; } });
    const xp = xr2 != null ? xrPct(xr2) : null; if (xp != null) { s += xp; any = true; }
    if (pts2 != null) { const g2 = ptsWin[ptsBand(pts2)]; if (g2 && g2.n >= 5) { s += g2.w / g2.n * 100; any = true; } }
    return any ? Math.round(s) : null; };

  // ---- the engine (same as PRINT LIST) ----
  const PTS = [5, 3, 1];
  const clm = (nm) => { const m = String(nm || '').match(/\((\d)\)/); return m ? Number(m[1]) : 0; };
  const pctB = (b) => { const list = Object.entries(b || {}).filter(([, s]) => s.runs >= 100 && s.exp > 0).map(([id, s]) => ({ id, ae: s.wins / s.exp })).sort((a, b2) => b2.ae - a.ae); const map = {}; const n = list.length; list.forEach((x, i) => { map[x.id] = n > 1 ? (1 - i / (n - 1)) * 100 : 50; }); return map; };
  const pj = pctB(people.jockeys), pt = pctB(people.trainers);
  const strike = (b, id, min) => { const s = (b || {})[id]; return s && s.runs >= min ? s.wins / s.runs : null; };
  const xs1f = (r) => { const js = (people.jockeys || {})[r.jid], ts = (people.trainers || {})[r.tid];
    if (!(js && js.runs >= 50 && ts && ts.runs >= 50 && r.d > 1)) return null;
    return Math.round((js.wins / js.runs * 100 + ts.wins / ts.runs * 100) / r.d * 10) / 10; };
  const scoreRace = (rs) => {
    const sc = {}; const tag = (h2, t3, p2) => { const s = (sc[h2] = sc[h2] || { pts: 0, tags: [] }); s.pts += p2; s.tags.push(t3); };
    const rank = (label, fn) => { const vals = rs.map((r, i) => ({ i, v: fn(r) })).filter(e => e.v != null).sort((a, b2) => b2.v - a.v);
      vals.slice(0, 3).forEach((e, k2) => tag(rs[e.i].h, label + (k2 + 1), PTS[k2])); };
    rank('J', (r) => strike(people.jockeys, r.jid, 50));
    rank('T', (r) => strike(people.trainers, r.tid, 50));
    rank('PAIR', (r) => { const p = (people.pairs || {})[r.jid + '|' + r.tid]; return p && p.r >= 10 && p.e > 0 ? p.w / p.e : null; });
    const orVals = rs.map(r => r.ofr).filter(v => v != null);
    const orMean = orVals.length >= 2 ? orVals.reduce((a, b2) => a + b2, 0) / orVals.length : null;
    const ok2 = rs.filter(r => r.ofr != null && r.lbs != null); const adv = {};
    if (ok2.length >= 2) { const top = ok2.reduce((a, b2) => b2.ofr > a.ofr ? b2 : a, ok2[0]); const car = (r) => r.lbs - clm(r.jockey); const tc = car(top); ok2.forEach(r => { adv[r.h] = (r.ofr + (tc - car(r))) - top.ofr; }); }
    rank('WR', (r) => adv[r.h] != null && adv[r.h] > 0 ? adv[r.h] : null);
    rank('OR', (r) => r.ofr != null ? r.ofr : null);
    {
      const s = rs.map(r => { const parts = []; if (r.jid && pj[r.jid] != null) parts.push(pj[r.jid]); if (r.tid && pt[r.tid] != null) parts.push(pt[r.tid]); const v = parts.length ? parts.reduce((a, b2) => a + b2, 0) / parts.length : 50;
        return 0.8 * (v - 50) / 50 + 0.6 * (orMean != null && r.ofr != null ? r.ofr - orMean : 0) / 20 + 0.5 * (adv[r.h] || 0) / 10; });
      const ex = s.map(v => Math.exp(v)); const Z = ex.reduce((a, b2) => a + b2, 0);
      const edges = rs.map((r, i) => r.d > 1 ? ((ex[i] / Z) - 1 / r.d) / (1 / r.d) : null);
      const negs = rs.map((r, i) => ({ r, e: edges[i] })).filter(x => x.e != null && isFinite(x.e) && x.e < 0).sort((a, b2) => a.e - b2.e);
      negs.slice(0, 3).forEach((x, k2) => tag(x.r.h, 'M' + (k2 + 1), PTS[k2]));
      rs.forEach((r, i) => { const pr2 = ex[i] / Z;
        if (pr2 > 0) (sc[r.h] = sc[r.h] || { pts: 0, tags: [] }).pe = pr2;
        if (edges[i] != null && isFinite(edges[i])) { (sc[r.h] = sc[r.h] || { pts: 0, tags: [] }).edge = edges[i]; if (edges[i] > 0) tag(r.h, '+', 1); } });
    }
    return sc;
  };

  const fieldDay = { [ukd]: {} };
  byDay[ukd].forEach(p => { fieldDay[ukd][p.k] = p._rs; });

  const ordTxt = (v) => { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n + (({1:'st',2:'nd',3:'rd'})[n] || 'th') : String(v); };

  const nextOff = list[0];
  const chips = `<div style="margin:10px 0 2px"><span class="chip">${list.length} race${list.length === 1 ? '' : 's'} to run</span><span class="chip">next off ${nextOff.t} ${String(nextOff.course).replace(/\s*\([^)]*\)/g, '').toUpperCase()}</span></div>`;
  const jump = '';

  const tileReg = {}; const listRows = [];
  const tsCmp = { pts: [(q) => q.s.pts, -1], mp: [(q) => q.mp, 1], pct: [(q) => q.pct, -1], sig: [(q) => q.sig, -1], lum: [(q) => q.sig != null && Number(q.r.d) > 0 ? q.sig / Number(q.r.d) : null, -1], xs: [(q) => q.xv, -1], mx: [(q) => q.sig != null && Number(q.r.d) > 0 ? q.sig * Number(q.r.d) : null, -1], min: [(q) => q.s.edge != null && isFinite(q.s.edge) ? q.s.edge : null, 1] };
  document.addEventListener('click', async (ev) => {
    const cb = ev.target.closest('.tsort button[data-cls]');
    if (cb) {
      const wrap2 = cb.closest('.tsort'); const tid2 = wrap2.dataset.tid; const reg2 = tileReg[tid2]; if (!reg2 || reg2.clsDone) return;
      reg2.clsDone = true; cb.textContent = '\u2026';
      await Promise.all(reg2.runners.map(async (q) => { try {
        if (!q.r.hid) { q.clsMiss = true; return; }
        const j = await (await fetch('/api/horsehist?hid=' + encodeURIComponent(q.r.hid))).json();
        const runs = (j && j.runs) || (j && j.history) || [];
        const lastC = runs.length ? runs[runs.length - 1] : null;
        const sorted2 = runs.slice().sort((a, b2) => String(b2.date).localeCompare(String(a.date)));
        const last = sorted2.find(r2 => typeof r2.cls === 'number');
        if (last && reg2.rcls != null) q.cls = { last: last.cls, now: reg2.rcls, dir: last.cls < reg2.rcls ? 'down' : last.cls > reg2.rcls ? 'up' : 'same' };
        else q.clsMiss = true;

    let ri = 0;
    const w2 = async () => { while (ri < rest.length) { const jb = rest[ri++]; try {
      const j = await (await fetch('/api/horsehist?v=2&hid=' + encodeURIComponent(jb.q.r.hid))).json();
      applyRuns(jb.q, jb.x.rcls, cKeyPre(jb.x.course), furlOfPre(jb.x.dist), (j && j.runs) || []);
      if (window.__draw) window.__draw();
    } catch {} } };
    await Promise.all([1, 2, 3].map(w2));
  })();
  const jm2 = document.querySelector('.jump');
  if (jm2) jm2.addEventListener('click', (ev) => { const a = ev.target.closest('a'); if (!a) return;
    ev.preventDefault(); const el = document.getElementById(a.getAttribute('href').slice(1));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
})();
</script>
