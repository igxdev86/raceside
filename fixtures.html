<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RACESIDE · 2026 FIXTURES</title>
<script src="/nav.js?v=4" defer></script>
<style>
  .fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:14px}
  .fxc{padding:9px 11px}
  .fxc b{font-family:var(--mono);font-size:17px;display:block}
  .fxc span{font-size:10px;color:var(--dim);letter-spacing:.03em}
  .fxday{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
  .fxday .d{flex:none;width:112px;font-family:var(--mono);font-size:11px;color:var(--ink)}
  .fxday .c{font-size:12px;color:var(--dim)}
  .big{font-size:24px;font-weight:800;font-family:var(--mono)}
  .bld{animation:bld 1.2s ease-in-out infinite;color:var(--gold);font-family:var(--mono)}
  @keyframes bld{0%,100%{opacity:.35}50%{opacity:1}}
  #fxprogbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:5px}
  #fxprogbar div{height:100%;background:var(--gold);width:0%;transition:width .4s}
</style>
</head>
<body>
<header>
  <div class="wordmark">2026 <b>FIXTURES</b><small id="fxsub">upcoming GB &amp; IRE</small></div>
</header>
<main>
  <p class="note">Every upcoming fixture the feed will give — date and course, nothing else. Track tiles count each course’s remaining meetings.</p>
  <div id="app"><div class="state"><div class="spinner"></div>loading fixtures\u2026</div></div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  const ckey = (c) => String(c || '').toLowerCase().replace(/\s*\([^)]*\)/g, '').replace(/[^a-z]/g, '');
  const clm = (nm) => { const m = String(nm || '').match(/\((\d)\)/); return m ? Number(m[1]) : 0; };
  const pctB = (bucket) => { const list = Object.entries(bucket || {}).filter(([, s]) => s.runs >= 100 && s.exp > 0).map(([id, s]) => ({ id, ae: s.wins / s.exp })).sort((a, b) => b.ae - a.ae); const map = {}; const n = list.length; list.forEach((x, i) => { map[x.id] = n > 1 ? (1 - i / (n - 1)) * 100 : 50; }); return map; };
  // per-race signal picks under the site's model at SP: M1, WR best-in, best jockey, best trainer, best pair
  function sigsOf(rc, pj, pt, store) {
    const rs = (rc.runners || []).filter(r => r.d > 1);
    if (rs.length < 3) return null;
    const winI = rs.findIndex(r => r.pos === '1' || r.won === 1);
    if (winI < 0) return null;
    const out = {};
    const rec = (k, i) => { if (i != null && i >= 0) out[k] = { won: i === winI, e: 1 / rs[i].d }; };
    const orVals = rs.map(r => r.ofr).filter(v => v != null);
    const orMean = orVals.length >= 2 ? orVals.reduce((a, b) => a + b, 0) / orVals.length : null;
    const ok = rs.filter(r => r.ofr != null && r.lbs != null); const adv = {};
    if (ok.length >= 2) { const top = ok.reduce((a, b) => b.ofr > a.ofr ? b : a, ok[0]); const car = (r) => r.lbs - clm(r.jockey); const tc = car(top); ok.forEach(r => { adv[r.h] = (r.ofr + (tc - car(r))) - top.ofr; }); }
    // M1 (needs ratings)
    if (orMean != null) {
      const s = rs.map(r => { const parts = []; if (r.jid && pj[r.jid] != null) parts.push(pj[r.jid]); if (r.tid && pt[r.tid] != null) parts.push(pt[r.tid]); const sc = parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : 50;
        return 0.8 * (sc - 50) / 50 + 0.6 * (r.ofr != null ? r.ofr - orMean : 0) / 20 + 0.5 * (adv[r.h] || 0) / 10; });
      const ex = s.map(v => Math.exp(v)); const Z = ex.reduce((a, b) => a + b, 0);
      let mi = -1, me = 0;
      rs.forEach((r, i) => { const edge = ((ex[i] / Z) - 1 / r.d) / (1 / r.d); if (isFinite(edge) && edge < me) { me = edge; mi = i; } });
      rec('m1', mi >= 0 ? mi : null);
    }
    // WR best-in (strictly best positive advantage)
    let wi = -1, wv = 0; rs.forEach((r, i) => { const a = adv[r.h]; if (a != null && a > wv) { wv = a; wi = i; } });
    rec('wr', wi >= 0 ? wi : null);
    const argmax = (fn) => { let bi = -1, bv = -Infinity, dup = false; rs.forEach((r, i) => { const v = fn(r); if (v == null) return; if (v > bv) { bv = v; bi = i; dup = false; } else if (v === bv) dup = true; }); return dup ? -1 : bi; };
    rec('j', argmax(r => { const s = (store.jockeys || {})[r.jid]; return s && s.runs >= 50 ? s.wins / s.runs : null; }));
    rec('t', argmax(r => { const s = (store.trainers || {})[r.tid]; return s && s.runs >= 50 ? s.wins / s.runs : null; }));
    rec('pair', argmax(r => { const p = (store.pairs || {})[r.jid + '|' + r.tid]; return p && p.r >= 10 && p.e > 0 ? p.w / p.e : null; }));
    return out;
  }
  async function trackWalk(onDone) {
    let store; try { const r = await fetch('/api/peopleall?v=2'); store = await r.json(); if (!store.ok) throw 0; } catch { const el = $('fxwalk'); if (el) el.textContent = 'people feed unavailable \u2014 reload to retry the track records'; return; }
    const pj = pctB(store.jockeys), pt = pctB(store.trainers);
    const year = new Date().getFullYear();
    let st = null; try { st = JSON.parse(localStorage.getItem('rsfxm:v2') || 'null'); } catch {}
    if (!(st && String(st.year) === String(year))) st = null;
    if (!st) { try { const r = await fetch('/api/yearstate?k=trkstate:v2'); const j = await r.json(); if (j && j.state && String(j.state.year) === String(year)) st = j.state; } catch {} }
    if (!st) st = { year, lastDate: null, courses: {} };
    onDone(st, false);   // paint whatever is already known before walking
    const yEnd = new Date(Date.now() - 86400000);
    const start = st.lastDate ? new Date(Date.parse(st.lastDate) + 86400000) : new Date(year, 0, 1);
    let n = 0;
    for (let d = start; d <= yEnd; d = new Date(d.getTime() + 86400000)) {
      const dt = d.toISOString().slice(0, 10);
      let j = null; try { const r = await fetch('/api/priceday?v=5&date=' + dt); j = await r.json(); } catch {}
      st.lastDate = dt;
      if (j && j.ok) (j.races || []).forEach(rc => {
        const sig = sigsOf(rc, pj, pt, store); if (!sig) return;
        const k = ckey(rc.course); if (!k) return;
        const a = (st.courses[k] = st.courses[k] || {});
        Object.entries(sig).forEach(([s2, v]) => { const b = (a[s2] = a[s2] || { r: 0, w: 0, e: 0 }); b.r++; b.e += v.e; if (v.won) b.w++; });
      });
      if (n % 4 === 0 || n === 1) { const doy = (s2) => Math.floor((Date.parse(s2) - Date.parse(year + '-01-01')) / 86400000) + 1; const pct = Math.min(99, Math.round(doy(dt) / doy(yEnd.toISOString().slice(0, 10)) * 100));
        const pe = $('fxpct'); if (pe) pe.textContent = pct + '%';
        const pb = document.querySelector('#fxprogbar div'); if (pb) pb.style.width = pct + '%';
        const el = $('fxwalk'); if (el) el.textContent = 'scoring the year\u2026 ' + dt + ' \u00b7 first visit takes a few minutes, then instant for everyone'; }
      if (++n % 10 === 0) onDone(st, false);
    }
    if (n) { try { localStorage.setItem('rsfxm:v2', JSON.stringify(st)); } catch {}
      try { fetch('/api/yearstate?k=trkstate:v2', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(st) }); } catch {} }
    onDone(st, true);
  }
  const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  async function main() {
    let j = null;
    try { const r = await fetch('/api/fixtures'); j = await r.json(); } catch {}
    if (!(j && j.ok)) { $('app').innerHTML = '<div class="state">fixtures feed unavailable</div>'; return; }
    const fx = j.fixtures || [];
    if (!fx.length) { $('app').innerHTML = '<div class="state">no upcoming fixtures returned</div>'; return; }
    const counts = {};
    fx.forEach(f => { counts[f.course] = (counts[f.course] || 0) + 1; });
    const courses = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const days = {};
    fx.forEach(f => { (days[f.date] = days[f.date] || []).push(f.course); });
    const dates = Object.keys(days).sort();
    const fmt = (dt) => { const d = new Date(dt + 'T12:00:00'); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
    const near = j.source === 'racecards-fallback';
    $('app').innerHTML =
      `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <div class="tile" style="padding:10px 14px;margin:0"><span class="big">${fx.length}</span><div class="sub">fixtures</div></div>
        <div class="tile" style="padding:10px 14px;margin:0"><span class="big">${dates.length}</span><div class="sub">racing days</div></div>
        <div class="tile" style="padding:10px 14px;margin:0"><span class="big">${courses.length}</span><div class="sub">tracks</div></div>
        <div class="tile" id="fxprog" style="padding:10px 14px;margin:0;min-width:150px"><span class="big" id="fxpct" style="color:var(--gold)">0%</span><div class="sub">scoring 2026 M1 records</div><div id="fxprogbar"><div></div></div></div></div>
      <div class="fxgrid" id="fxgrid">${courses.map(([c, n]) => `<div class="tile fxc" style="margin:0" data-ck="${ckey(c)}"><b>${n}</b><span>${c}</span><div class="sub" style="margin-top:3px;font-size:9.5px" data-m1><span class="bld">building\u2026</span></div></div>`).join('')}</div>
      <div class="sub" id="fxwalk" style="margin-bottom:10px">scoring the year for minus-1 strike per track\u2026</div>
      ${near ? '<div class="sub" style="margin-bottom:10px">this plan\\u2019s feed only lists the next couple of days \u2014 the full-year calendar needs a fixtures endpoint on the Racing API account. The list below is what it gave.</div>' : ''}
      <div class="tile">${dates.map(dt => `<div class="fxday"><span class="d">${fmt(dt)}</span><span class="c">${days[dt].sort().join(' \u00b7 ')}</span></div>`).join('')}</div>
      <div class="sub" style="margin:10px 0">source: ${j.source} \u00b7 ${j.from} \u2192 ${j.to}</div>`;
    const sub = $('fxsub'); if (sub) sub.textContent = fx.length + ' fixtures \u00b7 ' + courses.length + ' tracks';
    trackWalk((st, done) => {
      if (done) { const p = $('fxprog'); if (p) p.remove(); }
      const w = $('fxwalk'); if (w && done) w.textContent = 'each signal\u2019s 2026 record at that track: strike \u00b7 wins/races \u00b7 (\u00a31-at-SP A/E) \u00b7 \u2605 = the track\u2019s best signal by A/E (20+ races) \u00b7 gold border = best M1 strike \u00b7 full-year people stats, map not proof';
      let best = null;
      const SIGS = [['m1', 'M1'], ['wr', 'WR'], ['j', 'J'], ['t', 'T'], ['pair', 'PAIR']];
      document.querySelectorAll('#fxgrid [data-ck]').forEach(el => {
        const a = st.courses[el.getAttribute('data-ck')];
        const out = el.querySelector('[data-m1]');
        if (!a) { if (done) out.textContent = '\u2014'; return; }
        let bestAe = null;
        SIGS.forEach(([s2]) => { const b = a[s2]; if (b && b.r >= 20 && b.e > 0 && (!bestAe || b.w / b.e > bestAe.v)) bestAe = { s: s2, v: b.w / b.e }; });
        out.innerHTML = SIGS.map(([s2, lbl]) => {
          const b = a[s2];
          if (!b || !b.r) return '';
          const hot = bestAe && bestAe.s === s2;
          const ae2 = b.e > 0 ? (b.w / b.e).toFixed(2) : '\u2014';
          const body = b.r < 10 ? lbl + ' ' + b.w + '/' + b.r
            : lbl + ' <b>' + Math.round(b.w / b.r * 100) + '%</b> ' + b.w + '/' + b.r + ' <span style="color:' + (b.w / b.e > 1 ? 'var(--green)' : 'var(--red)') + '">(' + ae2 + ')</span>';
          return '<div style="' + (hot ? 'color:var(--gold)' : '') + '">' + body + (hot ? ' \u2605' : '') + '</div>';
        }).join('');
        const m = a.m1;
        if (m && m.r >= 20 && (!best || m.w / m.r > best.v)) best = { el, v: m.w / m.r };
      });
      if (best && done) best.el.style.border = '1px solid var(--gold)';
    });
  }
  main();
})();
</script>
</body>
</html>
